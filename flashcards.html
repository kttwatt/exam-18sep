<h1>📚 สอบทฤษฎีครั้งที่ 1 พยคร 627 — Flashcard Q&amp;A (ถาม-ตอบ-อธิบาย) 194 ใบ</h1>
<div class="sub">เลือกหัวข้อเพื่อทบทวนเฉพาะเรื่อง หรือ "ทั้งหมด" · คลิกการ์ดเพื่อพลิกดูคำตอบ</div>

<script>
let CARDS=[{"f": "David McClelland เริ่มศึกษาแนวคิด Competency ในช่วงปีใด และเขาให้นิยามว่าอย่างไร?", "b": "เริ่มปี 1970 นิยามว่าเป็นบุคลิกลักษณะที่ซ่อนอยู่ภายในแต่ละบุคคลซึ่งผลักดันให้สร้างผลการปฏิบัติงานที่ดีหรือตามเกณฑ์ที่กำหนด [สไลด์]", "t": "Competency in OR"}, {"f": "Iceberg Model ของ McClelland-Spencer แบ่งส่วนที่มองเห็นง่ายกับมองเห็นยากออกเป็นอะไรบ้าง?", "b": "ส่วนบนน้ำ (มองเห็นง่าย) = Knowledge + Skill / ส่วนใต้น้ำ (มองเห็นยาก) = Social Role, Self-Image, Trait, Motives [สไลด์]", "t": "Competency in OR"}, {"f": "สมรรถนะพยาบาลห้องผ่าตัด 4 ด้านตามสมาคมพยาบาลห้องผ่าตัดแห่งประเทศไทย พ.ศ. 2554 มีอะไรบ้าง?", "b": "ความปลอดภัยผู้ป่วย / ร่างกาย / การตอบสนองพฤติกรรม / ระบบสุขภาพ [สไลด์]", "t": "Competency in OR"}, {"f": "Technical Competency แบ่งย่อยเป็นกี่ระดับ อะไรบ้าง?", "b": "3 ระดับ — Basic (พื้นฐานทุกคนต้องมี) / Specific (เฉพาะกลุ่มผู้ป่วย) / Advance (บูรณาการคลินิก+เฉพาะทาง) [สไลด์]", "t": "Competency in OR"}, {"f": "Basic/Specific/Advance เป็นการแบ่งย่อยของ Competency ประเภทใด เป็นประเภทคู่ขนานกับ Core/Non-Technical หรือไม่?", "b": "เป็นการแบ่งย่อยของ Technical Competency เท่านั้น ไม่ใช่ประเภทคู่ขนานกับ Core/Non-Technical [สไลด์]", "t": "Competency in OR"}, {"f": "ตาม Benner (1984) ระดับ Proficient ตรงกับประสบการณ์กี่ปี?", "b": "3-5 ปี (Novice 0-1y, Advance beginner 1-2y, Competent 2-3y, Proficient 3-5y, Expert 5y ขึ้นไป) [สไลด์]", "t": "Competency in OR"}, {"f": "PL1-PL5 (Proficiency Level) จับคู่ตรงกับปีประสบการณ์ของ Benner หรือไม่?", "b": "ไม่ได้จับคู่กันโดยตรง — Benner ใช้ปีประสบการณ์เป็นเกณฑ์ ส่วน PL ใช้พฤติกรรมบ่งชี้เป็นเกณฑ์ เป็นคนละกรอบกัน [สไลด์]", "t": "Competency in OR"}, {"f": "SPINTS (สำหรับพยาบาลส่งเครื่องมือ) มีกี่หมวดหลักตามกรอบดั้งเดิม อะไรบ้าง?", "b": "3 หมวด — Situation Awareness, Communication and Teamwork, Task Management [สไลด์]", "t": "Competency in OR"}, {"f": "NOTSS (สำหรับศัลยแพทย์) มีกี่หมวด ต่างจาก SPINTS อย่างไร?", "b": "NOTSS มี 4 หมวด (Situation Awareness, Decision Making, Communication&Teamwork, Leadership) ส่วน SPINTS ดั้งเดิมมีแค่ 3 หมวด ไม่มี Leadership [สไลด์]", "t": "Competency in OR"}, {"f": "ANTS ใช้ประเมินใคร มีหมวดอะไรบ้าง?", "b": "ใช้กับวิสัญญีแพทย์ มี 4 หมวด — Task Management, Team Working, Situation Awareness, Decision Making [สไลด์]", "t": "Competency in OR"}, {"f": "กรอบ Non-technical skills in Perioperative Nurses ต่างจาก SPINTS ดั้งเดิมอย่างไร?", "b": "เพิ่มหมวดที่ 4 คือ Decision making and leadership (Prioritization/Negotiation/Continuing learning) ซึ่งไม่ใช่ส่วนหนึ่งของ SPINTS ดั้งเดิม [สไลด์]", "t": "Competency in OR"}, {"f": "Scrub Nurse Level 1 กับ Circulating Nurse Level 1 เน้นบทบาทต่างกันอย่างไร?", "b": "Scrub L1 เน้นปกป้องเขตปลอดเชื้อและดูผ่าตัดตั้งใจ / Circulating L1 เน้นทำความสะอาดห้องผ่าตัด เตรียมอุปกรณ์พื้นฐาน และบันทึกข้อมูล [สไลด์]", "t": "Competency in OR"}, {"f": "การประเมิน Competency ของพยาบาลทำบ่อยแค่ไหน และมีวิธีประเมินกี่วิธี?", "b": "ปีละ 1 ครั้ง มีวิธีประเมิน 6 วิธี — Audit, Certification/Training, CQI/PI, Interview, Observation, Testing [สไลด์]", "t": "Competency in OR"}, {"f": "สมรรถนะหลักภาครัฐ 5 ด้านของ ก.พ. (2553) เป็นกรอบเดียวกับสมรรถนะพยาบาลห้องผ่าตัด 4 ด้านหรือไม่?", "b": "ไม่ใช่ เป็นคนละกรอบคนละที่มา (ก.พ. vs สมาคมพยาบาลห้องผ่าตัดแห่งประเทศไทย) ห้ามตอบสลับกัน [สไลด์]", "t": "Competency in OR"}, {"f": "แบบประเมินสมรรถนะจริงของสมาคมฯ ใช้คอลัมน์ E/S/P/G หมายถึงอะไร?", "b": "Expect (หน่วยงานคาดหวัง) / Self (ประเมินตนเอง) / Preceptor (พี่เลี้ยงประเมิน) / Gap (ความห่างจากเป้าหมาย) [สไลด์]", "t": "Competency in OR"}, {"f": "ประเภทสมรรถนะตามจิรประภา อัครบวร (2549) ต่างจากประเภท Core/Technical/Non-Technical ของสไลด์นี้อย่างไร?", "b": "จิรประภาแบ่งเป็น Core competency / Functional competency (2 ประเภท) เป็นคนละกรอบกับ Core/Technical/Non-Technical (3 ประเภท) ของสไลด์นี้ [สไลด์]", "t": "Competency in OR"}, {"f": "Job Description พยาบาลผ่าตัดแบ่งเป็นกี่ช่วง อะไรบ้าง?", "b": "3 ช่วง — ก่อนผ่าตัด / ระหว่างผ่าตัด / หลังผ่าตัด [สไลด์]", "t": "Competency in OR"}, {"f": "ODS (One Day Surgery) นิยามว่าผู้ป่วยต้องอยู่โรงพยาบาลนานเท่าใด?", "b": "ตั้งแต่ 2 ชั่วโมง ถึงไม่เกิน 24 ชั่วโมง แล้วกลับบ้านวันเดียวกับวันที่เข้ารับการรักษา [สไลด์]", "t": "ODS"}, {"f": "ข้อมูล ODS ปี 2561-2564 มีจำนวนผู้ป่วยและลดค่าใช้จ่ายภาคประชาชนเท่าใด?", "b": "ทำหัตถการ ODS 41,532 ราย ลดค่าใช้จ่ายภาคประชาชน 66,451,200 บาท [สไลด์]", "t": "ODS"}, {"f": "ประมาณการค่าใช้จ่ายที่ผู้ป่วยประหยัดได้ต่อคนต่อวันจาก ODS คำนวณจากอะไรบ้าง?", "b": "800 บาท/วัน = อาหาร 200 + เดินทาง 200 + ค่าเสียเวลา 400 บาท [สไลด์]", "t": "ODS"}, {"f": "2P Safety ใน ODS ย่อมาจากอะไร มีกี่องค์ประกอบ?", "b": "Patient & Personnel Safety มี 6 องค์ประกอบ — Surgical Safety Checklist, SSI prevention, Safe Anesthesia, Safe Operating Room, Acute Pain Management, Security & Privacy of Information [สไลด์]", "t": "ODS"}, {"f": "Surgical Safety Checklist มี 3 ระยะอะไรบ้าง และหลักการสำคัญคืออะไร?", "b": "Sign in (ก่อนยาระงับความรู้สึก) → Time out (ก่อนลงมีด) → Sign out (ก่อนออกจากห้องผ่าตัด) ตามหลัก Zero defect ทำครบทีละขั้นห้ามข้าม [สไลด์]", "t": "ODS"}, {"f": "SSI (surgical site infection) แบ่งช่วงเวลาเฝ้าระวังตามชนิดแผลอย่างไร?", "b": "Superficial/deep incisional ภายใน 30 วัน / organ-space ภายใน 30 วัน หรือ 90 วันถ้ามี implant / เฝ้าระวังเชิงรุกที่ 24, 48, 72 ชั่วโมง [สไลด์]", "t": "ODS"}, {"f": "ห้องผ่าตัดปลอดภัยตามมาตรฐาน 2P ต้องมีระบบระบายอากาศและอุณหภูมิเท่าใด?", "b": "ระบบระบายอากาศ 20 air change per hour (ACH) และอุณหภูมิห้อง 22-24°C [สไลด์]", "t": "ODS"}, {"f": "Acute pain ตามนิยามของ 2P Safety หมายถึงอาการปวดกี่เดือน และส่วนใหญ่เป็นชนิดใด?", "b": "ปวด ≤3 เดือน ส่วนใหญ่เป็นชนิด nociceptive ร่วมกับการอักเสบ รักษาด้วย multimodal + preventive analgesia [สไลด์]", "t": "ODS"}, {"f": "พยาบาลผู้ประสานงานโทรติดต่อผู้ป่วยก่อนผ่าตัดกี่วัน เพื่อทำอะไร?", "b": "โทร 7-10 วันก่อนผ่าตัด เพื่อเตรียมสิทธิการรักษา/งดยาละลายลิ่มเลือด/ยาระบาย และโทรซ้ำ 1-3 วันก่อนผ่าตัดเพื่อแนะนำการปฏิบัติตัว [สไลด์]", "t": "ODS"}, {"f": "พยาบาลผู้ประสานงานโทรติดตามผู้ป่วยหลังผ่าตัดวันใดบ้าง?", "b": "Post-op day 0, day 1, และ day 2 [สไลด์]", "t": "ODS"}, {"f": "MIS ต่างจากการผ่าตัดแบบเปิดอย่างไรตามนิยามในสไลด์?", "b": "MIS คือผ่าตัดแผลเล็ก/ผ่านกล้อง แผลอาจมากกว่า 1 แผลแต่เล็ก ใช้เทคโนโลยีลดบาดเจ็บ ลดปวดแผล ฟื้นตัวเร็วกว่าผ่าตัดเปิด [สไลด์]", "t": "ODS"}, {"f": "บทบาทพยาบาล WR ก่อนผ่าตัดต้องซักประวัติเรื่องใดบ้างที่สำคัญ?", "b": "งดน้ำ-อาหาร, โรคประจำตัว, ประวัติผ่าตัด/ยาระงับความรู้สึก, แพ้ยา/อาหาร/สมุนไพร, ยา anticoagulant, สูบบุหรี่/สุรา, ด้านจิตใจ-สังคม [สไลด์]", "t": "ODS"}, {"f": "พยาบาล RR (ห้องพักฟื้น) จำหน่ายผู้ป่วยเมื่อใด?", "b": "เมื่อถึงเกณฑ์ Discharge criteria พร้อมให้ความรู้การดูแลแผล/อาการผิดปกติที่ต้องรีบพบแพทย์/นัดตรวจติดตาม [สไลด์]", "t": "ODS"}, {"f": "ODS ลดวันนอนโรงพยาบาลรวมกี่วันจากข้อมูลปี 2561-2564?", "b": "83,064 วัน (คำนวณจาก 41,532 ราย คูณ 2 วัน) [สไลด์]", "t": "ODS"}, {"f": "จุดที่ข้อสอบชอบถามเรื่อง Mark site ในผู้ป่วย ODS คือประเด็นใด?", "b": "ต้องออกแบบระบบทำ Mark site ให้ชัดเจนว่าใครเป็นคนทำ เพราะผู้ป่วย ODS เดินทางมาจากบ้านและเข้าห้องผ่าตัดตอนเช้า ทำให้พลาดขั้นตอนนี้บ่อย [สไลด์]", "t": "ODS"}, {"f": "Patient safety concern during MIS ตามสไลด์มีกี่ข้อ อะไรบ้าง?", "b": "5 ข้อ — positioning, pressure injury, DVT, pneumoperitoneum, hypothermia [สไลด์]", "t": "MIS"}, {"f": "ในท่า lithotomy ทุก 1 ฟุตของการยกข้อเท้าเหนือระดับ aorta ความดัน ankle systolic/diastolic ลดลงเท่าใด?", "b": "ประมาณ 20 mmHg ต่อการยกข้อเท้าทุก 1 ฟุตเหนือ aorta ทำให้ลด capillary perfusion เพิ่มความเสี่ยง pressure injury [สไลด์]", "t": "MIS"}, {"f": "ในผู้ป่วย super obesity ต้องปรับท่า reverse Trendelenburg กี่องศา และใช้ instrument ยาวเท่าใด?", "b": "Reverse Trendelenburg 12-15° และใช้ laparoscopic instrument ยาวขึ้น 43-44 cm [สไลด์]", "t": "MIS"}, {"f": "DVT risk assessment ตาม AORN 2017 ระบุเกณฑ์เวลาผ่าตัดที่เพิ่มความเสี่ยงเท่าใด?", "b": "Laparoscopic surgery + Lithotomy position + operative time มากกว่า 3 ชั่วโมง ร่วมกับปัจจัยเสี่ยง เช่น old age หรือ obesity [สไลด์]", "t": "MIS"}, {"f": "ค่า ETCO2 ปกติระหว่างผ่าตัด MIS คือเท่าใด?", "b": "35-45 mmHg [สไลด์]", "t": "MIS"}, {"f": "จากงานวิจัย Wongyingsinn 2023 (n=742) OR ของปัจจัยเสี่ยง postoperative hypothermia คือเท่าใดบ้าง?", "b": "ASA physical status III-IV มี OR=1.78 / preoperative hypothermia มี OR=17.99 ต่างกันมาก ต้องจำคู่ให้แม่น [สไลด์]", "t": "MIS"}, {"f": "Forced-air warming blanket แนะนำให้ใช้ป้องกัน hypothermia ระหว่าง MIS หรือไม่ เพราะเหตุใด?", "b": "ไม่แนะนำ เพราะมีหลักฐาน (Koc BB, 2017) ว่าเพิ่มความเสี่ยงติดเชื้อ แม้เป็นวิธี warming ที่คุ้นเคย [สไลด์]", "t": "MIS"}, {"f": "แก๊สชนิดใดในกลุ่ม CO2/Nitrous oxide/Argon-Helium ที่ support combustion และ hazardous ต่อบุคลากร?", "b": "มีแค่ Nitrous oxide (N2O) เท่านั้นที่ทั้ง support combustion และ hazardous ไม่ใช่ CO2 ตามที่คนมักเข้าใจผิด [สไลด์]", "t": "MIS"}, {"f": "Solubility ของ CO2, Nitrous oxide, Argon/Helium (ml ต่อ 100ml น้ำ) เรียงจากมากไปน้อยเป็นอย่างไร?", "b": "CO2=170, Nitrous oxide=130, Argon/Helium=6 ml ต่อ 100ml น้ำ [สไลด์]", "t": "MIS"}, {"f": "จากงานวิจัย Montero 2010 การตรวจสอบ laparoscopic instrument แบบใช้ซ้ำ 165 ชิ้น พบ insulation failure กี่เปอร์เซ็นต์?", "b": "19% จึงแนะนำตรวจสอบเป็นประจำด้วย Insulation failure tester [สไลด์]", "t": "MIS"}, {"f": "daVinci Xi system ประกอบด้วยส่วนใดบ้าง และมีระบบคู่แข่งชื่ออะไร?", "b": "Surgeon console, Patient cart, Vision cart ส่วนระบบคู่แข่งคือ HUGO RAS System [สไลด์]", "t": "MIS"}, {"f": "การเตรียม robotic endoscope ห้ามใช้ warming liquid เกินอุณหภูมิเท่าใด?", "b": "ห้ามใช้เกิน 55°C [สไลด์]", "t": "MIS"}, {"f": "Warmed and humidified CO2 ช่วยเพิ่ม core temperature เฉลี่ยเท่าใดตามงานวิจัย Dean M. 2017?", "b": "เพิ่มเฉลี่ย 0.3°C [สไลด์]", "t": "MIS"}, {"f": "Siriraj ERAS มีกี่ modules ภายใต้ ERAS Core committee?", "b": "10 modules — Colorectal, Gynecology, Upper GI, Liver, Pancreas, Spine, Acute hip fracture, CVT, rAAA, Liver Transplant, Cystectomy [สไลด์]", "t": "MIS"}, {"f": "Contraindication ของ mechanical VTE prophylaxis ตาม NCCN 2015 ข้อใดเกี่ยวกับเกล็ดเลือด?", "b": "Platelet ต่ำกว่า 20,000 ถือเป็น severe thrombocytopenia ที่ห้ามใช้ [สไลด์]", "t": "MIS"}, {"f": "Purpose of Management in Laparoscopic surgery ตาม AORN 2020 มี 3 ข้อ อะไรบ้าง?", "b": "1) Reduce risk to patient and perioperative team 2) Managing distention media and irrigation 3) Maintain Lap instrument's function [สไลด์]", "t": "MIS"}, {"f": "Siriraj audit ผล keep core temperature มากกว่า 36°C ปี 2567 เทียบกับช่วง เม.ย.-มิ.ย. 2568 เป็นอย่างไร?", "b": "ปี 2567 = 69.84% / เม.ย.-มิ.ย. 2568 = 82.61% (38/46 ราย) ดีขึ้นชัดเจน [สไลด์]", "t": "MIS"}, {"f": "Gerota's fascia ห่อหุ้มอวัยวะใดบ้าง?", "b": "ห่อหุ้มทั้งไตและต่อมหมวกไต ไม่ใช่ไตอย่างเดียว [สไลด์]", "t": "URO anatomy"}, {"f": "ทางเดินปัสสาวะภายในไตเรียงลำดับจาก nephron ไปถึง ureter อย่างไร?", "b": "Nephron → Papillary duct → Minor calyx → Major calyx → Renal pelvis → Ureter → Bladder [สไลด์]", "t": "URO anatomy"}, {"f": "ความดันสุทธิที่ใช้กรองที่ glomerulus คำนวณจากค่าใดบ้าง?", "b": "Glomerular hydrostatic pressure 55 mmHg ลบ Blood colloid osmotic pressure 30 mmHg บวก Capsular hydrostatic pressure 15 mmHg เท่ากับ Net outward pressure 10 mmHg [สไลด์]", "t": "URO anatomy"}, {"f": "จุดตีบตามธรรมชาติของท่อไตมี 3 จุด อะไรบ้าง?", "b": "Ureteropelvic junction, Crossing iliac vessels/pelvic brim, Traversing bladder wall [สไลด์]", "t": "URO anatomy"}, {"f": "Trigone ของกระเพาะปัสสาวะแบ่งเป็น 2 ส่วน ต่อเนื่องมาจากโครงสร้างใดของท่อไต?", "b": "Superficial trigone (white zone) และ deep trigone ต่อเนื่องมาจาก Waldeyer's sheath ของท่อไตส่วนปลาย [สไลด์]", "t": "URO anatomy"}, {"f": "ในช่วง filling (storage) phase กระเพาะปัสสาวะและ sphincter อยู่ในสถานะใด ต่างจาก voiding phase อย่างไร?", "b": "Filling คือ bladder relax และ sphincter contract / Voiding คือ bladder contract และ sphincter relax [สไลด์]", "t": "URO anatomy"}, {"f": "เส้นประสาท parasympathetic ที่ควบคุมกระเพาะปัสสาวะออกจากไขสันหลังระดับใด และมีผลอย่างไร?", "b": "Pelvic nerve ระดับ S2-S4 ทำให้ detrusor หดตัวช่วยถ่ายปัสสาวะ ผ่านตัวรับ M3, M2 และ P2X1 [สไลด์]", "t": "URO anatomy"}, {"f": "เส้นประสาท sympathetic ที่ควบคุมกระเพาะปัสสาวะ (hypogastric nerve) ออกจากไขสันหลังระดับใด และมีผลอย่างไร?", "b": "T11-L2 ทำให้ detrusor คลายตัวผ่าน β2/β3-AR และ bladder neck หดตัวผ่าน α1-AR เพื่อเก็บกักปัสสาวะ [สไลด์]", "t": "URO anatomy"}, {"f": "Internal urethral sphincter อยู่ที่ตำแหน่งใด ต่างจาก external sphincter อย่างไร?", "b": "Internal sphincter อยู่ที่ bladder neck ควบคุมโดย sympathetic / External sphincter อยู่ที่ membranous urethra ควบคุมโดย pudendal — TURP มักทำลาย internal sphincter เป็นปกติของหัตถการ [สไลด์]", "t": "URO anatomy"}, {"f": "Surgical landmark สำคัญของ TURP ที่ต้องระบุให้ได้มีอะไรบ้าง?", "b": "Verumontanum (distal landmark), Bladder neck (proximal landmark), Surgical capsule (ระดับความลึกของการตัด) [สไลด์]", "t": "URO anatomy"}, {"f": "Colliculus seminalis มีความสำคัญอย่างไรต่อการผ่าตัดต่อมลูกหมาก?", "b": "เป็น landmark ที่การตัดต้องทำเหนือจุดนี้ เพื่อไม่ให้บาดเจ็บ external urethral sphincter [สไลด์]", "t": "URO anatomy"}, {"f": "Seminal vesicle ผลิตของเหลวคิดเป็นสัดส่วนเท่าใดของน้ำอสุจิทั้งหมด?", "b": "65-75% ของน้ำอสุจิทั้งหมด มี fructose และ prostaglandins [สไลด์]", "t": "URO anatomy"}, {"f": "มโนมนีมอนิก SEVEN UP ใช้จำลำดับทางเดินอสุจิอย่างไร?", "b": "Seminiferous tubule, Epididymis, Vas deferens, Ejaculatory duct, N คือไม่มี, Urethra, Penis [สไลด์]", "t": "URO anatomy"}, {"f": "ปริมาตรปัสสาวะเฉลี่ยต่อวันของผู้ใหญ่ตามสไลด์คือเท่าใด?", "b": "1.4 ลิตร [สไลด์]", "t": "URO anatomy"}, {"f": "ปัจจัยเสี่ยงของ TUR syndrome ที่เกี่ยวกับเวลาตัดและน้ำหนักต่อมคือเท่าใด?", "b": "เวลาตัดมากกว่า 90 นาที และน้ำหนักต่อมมากกว่า 45 กรัม เป็นปัจจัยเสี่ยงหลัก [สไลด์]", "t": "URO anatomy"}, {"f": "Radical cystectomy ในผู้ชายและผู้หญิงตัดอวัยวะร่วมด้วยต่างกันอย่างไร?", "b": "ในชายตัดพร้อม prostate ส่วนในหญิงตัดพร้อม anterior vagina/uterus [สไลด์]", "t": "URO anatomy"}, {"f": "มุมแนวไตแต่ละข้างทำมุมเท่าใดจากแนวกลางลำตัว (แนวตั้ง)?", "b": "30° จากแนวตั้ง [สไลด์]", "t": "URO anatomy"}, {"f": "ท่าผ่าตัดที่ใช้กับ TUR, URS, RIRS คือท่าใด และมีความเสี่ยงอะไร?", "b": "Lithotomy position เสี่ยง peroneal nerve injury จากแรงกด/ยืด และปัญหาการไหลเวียนเลือดที่ขาลดลง [สไลด์]", "t": "Periop URO"}, {"f": "ท่า Lateral/Kidney position ที่ใช้กับ nephrectomy มีความเสี่ยงอะไรบ้าง?", "b": "Respiratory compromise จากทรวงอกขยายตัวลำบาก และ ulnar nerve ถูกกดที่แขน ทำให้ชา/เสียวซ่า [สไลด์]", "t": "Periop URO"}, {"f": "ท่า Prone ที่ใช้กับ PCNL เสี่ยงภาวะแทรกซ้อนใด?", "b": "Pressure ulcer ที่หน้าอก/หน้าท้อง และภาวะแทรกซ้อนทางตา เช่น corneal abrasion จากแรงกดที่ตา [สไลด์]", "t": "Periop URO"}, {"f": "อุบัติการณ์ VTE หลัง urology surgery อยู่ในช่วงเท่าใด?", "b": "1-10% [สไลด์]", "t": "Periop URO"}, {"f": "Intermittent Pneumatic Compression (IPC) ช่วยลดโอกาสเกิด DVT ได้เท่าใด?", "b": "ลด asymptomatic และ distal DVT ได้ 60% ลด proximal DVT ได้ 50% ตามงานวิจัย Roderick P และคณะ 2005 [สไลด์]", "t": "Periop URO"}, {"f": "อาการหลักของ TURP syndrome มีอะไรบ้าง?", "b": "Hyponatremia, confusion, hypertension/hypotension, visual disturbances, seizures เกิดจากดูดซึม irrigation fluid มากเกินไป [สไลด์]", "t": "Periop URO"}, {"f": "การจัดการ CO2 gas embolism ระหว่างผ่าตัด laparoscopic urology ทำอย่างไร?", "b": "หยุดฉีด CO2 ทันทีและลดความดันในช่องท้อง ปิด nitrous oxide ให้ O2 100% พร้อม hyperventilation จัดท่าศีรษะต่ำตะแคงซ้าย [สไลด์]", "t": "Periop URO"}, {"f": "อาการของ gas embolism ที่พบทางคลินิกมีอะไรบ้าง?", "b": "Tachycardia, arrhythmia, hypotension, ECG change [สไลด์]", "t": "Periop URO"}, {"f": "CO2 subcutaneous emphysema กับ pneumothorax/pneumomediastinum ตรวจพบความผิดปกติทางห้องปฏิบัติการใดร่วมกัน?", "b": "PaCO2 และ ETCO2 สูงขึ้นทั้งคู่ ใช้แยกแยะจากภาวะแทรกซ้อนอื่น [สไลด์]", "t": "Periop URO"}, {"f": "ปัจจัยเสี่ยงจากชนิดผู้ป่วยต่อการเกิด VTE ในผู้ป่วย urology surgery มีอะไรบ้าง?", "b": "อายุ, โรคอ้วน, สูบบุหรี่, มะเร็ง, ประวัติ VTE เดิม [สไลด์]", "t": "Periop URO"}, {"f": "ความเสี่ยงเฉพาะของ Robotic Surgery ในระบบทางเดินปัสสาวะคืออะไร?", "b": "ระบบหุ่นยนต์ขัดข้องและภาวะแทรกซ้อนเฉพาะของหุ่นยนต์ที่ไม่พบในการผ่าตัดแบบอื่น [สไลด์]", "t": "Periop URO"}, {"f": "ความเสี่ยงเฉพาะของ Endoscopic Surgery เช่น TURP ในระบบทางเดินปัสสาวะคืออะไร?", "b": "เยื่อบุฉีกขาด/ทะลุ และการติดเชื้อทางเดินปัสสาวะ [สไลด์]", "t": "Periop URO"}, {"f": "กลยุทธ์ป้องกันแผลกดทับในท่า Prone สำหรับ PCNL คืออะไร?", "b": "ใช้อุปกรณ์ลดแรงกด เช่น gel pads หรือหมอนรอง กระจายแรงกด และตรวจสอบการป้องกันดวงตาอย่างสม่ำเสมอ [สไลด์]", "t": "Periop URO"}, {"f": "การป้องกัน Uro sepsis ในผู้ป่วยผ่าตัดทางเดินปัสสาวะเน้นเทคนิคใดบ้าง?", "b": "Aseptic techniques เคร่งครัด, prophylactic antibiotic management, hand hygiene ของบุคลากรผ่าตัด [สไลด์]", "t": "Periop URO"}, {"f": "แก๊สที่แนะนำใช้ทำ pneumoperitoneum ใน urology surgery คือแก๊สชนิดใด และเพราะเหตุใด?", "b": "Carbon dioxide เพราะเป็น inert gas ลดความเสี่ยงภาวะแทรกซ้อนจากการติดไฟหรือการระเบิด [สไลด์]", "t": "Periop URO"}, {"f": "ปัจจัยที่ทำให้ Gustilo-Anderson classification ของ open fracture สูงขึ้นมีอะไรบ้าง?", "b": "ปนเปื้อน (soil/dirty water/bites), บาดเจ็บนานเกิน 12 ชั่วโมง, high energy, bone loss, segmental fracture, crush injury, degloving injury, compartment syndrome, ต้อง flap coverage [สรุป]", "t": "Lower Extremity"}, {"f": "การให้ antibiotic ใน open fracture ตาม Gustilo grade ทำอย่างไร?", "b": "ฉีดไม่เกิน 24 ชั่วโมงหลังบาดเจ็บ Type I-II ใช้ 1st gen cephalosporin Type III ใช้ 1st gen cephalosporin + aminoglycoside ถ้าดินปนเปื้อนเพิ่ม Penicillin 2 ล้าน unit q 4 hr [สรุป]", "t": "Lower Extremity"}, {"f": "Hard signs ของ vascular injury ที่บ่งชี้ต้องผ่าตัดสำรวจโดยตรงมีอะไรบ้าง?", "b": "6P คือ Pulselessness, Pallor, Paresthesia, Pain, Paralysis, Poikilothermia รวมถึง massive bleeding, rapidly expanding hematoma, palpable thrill, audible bruit [สรุป]", "t": "Lower Extremity"}, {"f": "ค่า ABI เท่าใดถือว่าปกติ และเท่าใดถือว่าผิดปกติ?", "b": "ABI มากกว่า 0.9 คือปกติ ABI น้อยกว่า 0.9 คือผิดปกติต้องสืบสวนต่อ ถ้าหาค่าไม่ได้ใน distal injury/เด็กให้ใช้ angiography [สรุป]", "t": "Lower Extremity"}, {"f": "ในกรณี unstable orthopaedic injury ร่วมกับ vascular injury ควรจัดการลำดับความสำคัญอย่างไร?", "b": "Unstable injury ให้แก้ orthopaedic ก่อน ถ้า unstable และ delayed ให้ทำ temporary shunting ส่วน stable injury ให้แก้ vascular ก่อน [สรุป]", "t": "Lower Extremity"}, {"f": "Compartment syndrome วินิจฉัยจากความดันเท่าใด และวิธีรักษาคืออะไร?", "b": "ΔP เท่ากับ DBP ลบ compartment pressure น้อยกว่าหรือเท่ากับ 30 mmHg บ่งชี้ภาวะนี้ รักษาโดยปลด constrictive dressing ตามด้วย bivalve cast แล้ว fasciotomy และ stabilize fracture [สรุป]", "t": "Lower Extremity"}, {"f": "Fat Embolism Syndrome มีอาการเกิดขึ้นภายในกี่ชั่วโมงหลังบาดเจ็บ และวินิจฉัยตามเกณฑ์ Gurd อย่างไร?", "b": "อาการภายใน 24-72 ชั่วโมงหลังบาดเจ็บ วินิจฉัยเมื่อมี 2 major หรือ 1 major รวมกับ 4 minor criteria [สรุป]", "t": "Lower Extremity"}, {"f": "Major criteria ของเกณฑ์ Gurd สำหรับวินิจฉัย FES มีอะไรบ้าง?", "b": "Petechial rash, respiratory insufficiency, cerebral involvement, tachycardia [สรุป]", "t": "Lower Extremity"}, {"f": "Hip dislocation แบบ posterior มีลักษณะท่าขาอย่างไร และต้อง reduce ภายในกี่ชั่วโมง?", "b": "ท่า adduction, flexion, internal rotation ต้องทำ emergency reduction ภายในน้อยกว่า 6 ชั่วโมงภายใต้ GA [สรุป]", "t": "Lower Extremity"}, {"f": "หลัง reduce hip dislocation ต้องตรวจสอบเส้นประสาทใดเป็นพิเศษ?", "b": "Sciatic nerve test [สรุป]", "t": "Lower Extremity"}, {"f": "Displaced intracapsular hip fracture มักรักษาด้วยวิธีใด เพราะเหตุใด?", "b": "มักทำ arthroplasty เพราะมีความเสี่ยงสูงต่อ AVN ของ femoral head [สรุป]", "t": "Lower Extremity"}, {"f": "Tibial plateau fracture มี associated injury ที่ต้องเฝ้าระวังอะไรบ้าง?", "b": "Popliteal artery injury, peroneal nerve injury, compartment syndrome [สรุป]", "t": "Lower Extremity"}, {"f": "Ottawa Ankle Rules ใช้เกณฑ์ใดในการแยก sprain กับ fracture?", "b": "Bone tenderness ตามแนว 6 cm ของ distal fibula หรือ distal tibia หรือเดินลงน้ำหนักไม่ได้ 4 ก้าว [สรุป]", "t": "Lower Extremity"}, {"f": "Calcaneus fracture วัด Bohler angle และ Gissane's angle ปกติเท่าใด?", "b": "Bohler angle 20-40° และ Gissane's angle 105-135° [สรุป]", "t": "Lower Extremity"}, {"f": "Talar neck fracture มีความเสี่ยงสูงต่อภาวะใด และมักต้องรักษาด้วยวิธีใด?", "b": "เสี่ยง AVN อัตราสูง เกือบต้องผ่าตัดทุกครั้ง [สรุป]", "t": "Lower Extremity"}, {"f": "หลักการจัดการกระดูกหัก 4R มีอะไรบ้าง?", "b": "Recognition (ATLS, Hx/PE, Radiograph) ตามด้วย Reduction (closed/open) ตามด้วย Retention (external/internal fixation) และ Rehabilitation (ROM แล้ว stretching แล้ว strengthening) [สรุป]", "t": "Lower Extremity"}, {"f": "เหตุใด lower extremity จึงไวต่อภาวะ ischemia มากกว่า upper extremity เมื่อเกิด arterial injury?", "b": "เพราะ upper extremity มี collateral circulation มากกว่า lower extremity จึงทนต่อการขาดเลือดได้ดีกว่า [จริง]", "t": "Lower Extremity"}, {"f": "หลักการ B-Shape Principle ของ Surgical Stapler มีเป้าหมาย 3 ข้อ อะไรบ้าง?", "b": "Tissue Compression บีบอัดพอดี, Avoiding Leakage ป้องกันรั่วซึม/fistula, Preserve Vascularization รักษาการไหลเวียนเลือด [สไลด์]", "t": "GI Surgical Staple"}, {"f": "การเลือกสีตลับลวดของ Stapler ตามความหนาเนื้อเยื่อเป็นอย่างไร?", "b": "ขาวคือบางมากใช้กับเส้นเลือด ฟ้า/น้ำเงินคือปกติใช้กับกระเพาะ/ลำไส้ทั่วไป เขียวคือหนาใช้กับกระเพาะส่วนหนา ดำคือหนาพิเศษใช้กับเนื้อเยื่อหนาผิดปกติ [สไลด์]", "t": "GI Surgical Staple"}, {"f": "Safety Checklist 4 ข้อก่อนยิง Stapler เรียงลำดับอย่างไร?", "b": "เช็คความพร้อม ตามด้วยใส่ตลับลวด ตามด้วยเคลียร์พื้นที่ และกะแรงบีบเป็นขั้นสุดท้าย [สไลด์]", "t": "GI Surgical Staple"}, {"f": "เกณฑ์ผู้ป่วยผ่าตัดลดน้ำหนักตาม NIH Guideline คืออะไร?", "b": "BMI มากกว่า 40 หรือ BMI มากกว่า 35 ร่วมกับมีโรคร่วม [สไลด์]", "t": "GI Surgical Staple"}, {"f": "Sleeve Gastrectomy กับ Roux-en-Y Gastric Bypass ต่างกันอย่างไร?", "b": "Sleeve Gastrectomy ตัดกระเพาะบางส่วนเหลือเป็น gastric sleeve ต่อจาก duodenum-jejunum ส่วน Roux-en-Y สร้าง gastric pouch เล็กบายพาสกระเพาะและ duodenum เดิม เชื่อมตรงกับ jejunum [สไลด์]", "t": "GI Surgical Staple"}, {"f": "Post-op Day 0 หลัง bariatric surgery ให้สารน้ำอะไร อัตราเท่าใด และเกณฑ์ Notify แพทย์คือค่าใด?", "b": "Acetar 1000 ml IV อัตรา 120 ml/h ต้อง Notify ถ้า BP น้อยกว่า 90/60, PR มากกว่า 120, O2 น้อยกว่า 90% [สไลด์]", "t": "GI Surgical Staple"}, {"f": "การควบคุมน้ำตาลใน POCT วัดทุกกี่ชั่วโมง และเกณฑ์ให้ RI คือค่าใด?", "b": "เจาะ POCT ทุก 6 ชั่วโมง คุมระดับ 80-200 mg% ให้ RI ถ้าเกิน 200 mg% [สไลด์]", "t": "GI Surgical Staple"}, {"f": "การให้ Heparin ป้องกัน DVT หลัง bariatric surgery เริ่มให้เมื่อใด?", "b": "5000 unit SC เริ่มที่ 6 ชั่วโมงหลังผ่าตัด หากไม่มี bleeding [สไลด์]", "t": "GI Surgical Staple"}, {"f": "Post-op Day 1 หลัง bariatric surgery ให้อาหารชนิดใด พลังงานเท่าใด?", "b": "Clear liquid diet ไม่มีน้ำตาล ไขมันต่ำ โปรตีนสูง พลังงาน 600-800 kcal ต่อวัน [สไลด์]", "t": "GI Surgical Staple"}, {"f": "ทริคสำคัญเรื่องการรับประทานยาหลังผ่าตัด bariatric surgery คืออะไร นานเท่าใด?", "b": "ยาทุกชนิดต้องบดให้ละเอียดและผสมน้ำก่อนรับประทานทุกครั้งเป็นเวลา 3 เดือนหลังผ่าตัด เพื่อป้องกันการอุดตันของกระเพาะที่เย็บใหม่ [สไลด์]", "t": "GI Surgical Staple"}, {"f": "กฎ 5 ข้อหลังผ่าตัดกระเพาะที่สอนผู้ป่วยก่อนจำหน่ายมีอะไรบ้าง?", "b": "งดของหวาน/ของเหลวมีน้ำตาลป้องกัน Dumping Syndrome, เคี้ยวช้าๆละเอียด, กินแค่ 1 ถ้วย, ห้ามกักตุนอาหาร, จดบันทึกทุกอย่างที่กิน [สไลด์]", "t": "GI Surgical Staple"}, {"f": "อาหารเหลวหลังจำหน่ายจาก bariatric surgery ต้องกินต่อเนื่องอีกนานเท่าใด?", "b": "อีก 2 สัปดาห์ [สไลด์]", "t": "GI Surgical Staple"}, {"f": "หลักการ ERAS ในการวางแผนจำหน่ายผู้ป่วย bariatric surgery เริ่มต้นเมื่อใด?", "b": "เริ่มวางแผนจำหน่ายตั้งแต่วันแรกที่รับผู้ป่วยแอดมิท ร่วมกับทีมสหสาขาวิชาชีพ [สไลด์]", "t": "GI Surgical Staple"}, {"f": "เหตุใดในอดีตการเย็บด้วยมือจึงมีความเสี่ยงมากกว่าการใช้ Surgical Stapler?", "b": "เพราะเสี่ยงเกิดรอยรั่วซึ่งเป็นสาเหตุสำคัญของภาวะแทรกซ้อน ขณะที่ Stapler เร็วกว่าและสร้างรอยเย็บสม่ำเสมอกว่า ลดโอกาสรั่วซึม [สไลด์]", "t": "GI Surgical Staple"}, {"f": "การป้องกันภาวะหายใจผิดปกติหลัง bariatric surgery ในผู้ป่วยที่มี OSA ทำอย่างไร?", "b": "ให้ O2 cannula 3 LPM ตามปกติ และให้ใช้ CPAP ทุกครั้งที่หลับหากมีภาวะ OSA [สไลด์]", "t": "GI Surgical Staple"}, {"f": "PMMA bone cement ที่ใช้ยึด prosthesis ใน THA แข็งตัวภายในกี่นาที และเหมาะกับผู้ป่วยกลุ่มใด?", "b": "แข็งตัว 10-15 นาที เหมาะกับผู้สูงอายุ/คุณภาพกระดูกไม่ดี ต้องระวังในผู้ป่วยโรคหัวใจเพราะเสี่ยง pulmonary embolism [สรุป]", "t": "THA"}, {"f": "Cementless hip prosthesis ต้องรอเวลาเท่าใดกว่ากระดูกจะงอกยึด?", "b": "6-8 สัปดาห์ ใช้ในกรณีคุณภาพกระดูกแข็งแรงดี [สรุป]", "t": "THA"}, {"f": "Anterior approach ของ THA มีข้อดีและความเสี่ยงอะไรบ้าง?", "b": "ข้อดีคือบาดเจ็บกล้ามเนื้อน้อยและไม่เกิด hip dislocation ความเสี่ยงคือบาดเจ็บ femoral nerve และ lateral femoral cutaneous nerve/หลอดเลือด [สรุป]", "t": "THA"}, {"f": "Posterolateral approach ของ THA มีข้อดีและความเสี่ยงอะไรบ้าง?", "b": "ข้อดีคือเข้าข้อสะโพกง่าย เห็นเบ้าชัด ไม่บาดเจ็บ abductor ความเสี่ยงคือบาดเจ็บ sciatic nerve และมีโอกาส hip dislocation สูงกว่า [สรุป]", "t": "THA"}, {"f": "เกณฑ์เสียเลือด/ช็อกที่ต้องเฝ้าระวังหลัง THA คือค่าใด?", "b": "Intraoperative bleeding มากกว่า 500 cc หรือ vacuum drain มากกว่า 200 cc/hr, SBP น้อยกว่า 90, P มากกว่า 100, O2sat น้อยกว่า 95, urine น้อยกว่า 30 cc/hr [สรุป]", "t": "THA"}, {"f": "การจัดท่าป้องกัน hip prosthesis dislocation หลัง THA ทำอย่างไร?", "b": "นอนราบ หัวสูง 30° กางขา 15-30° มีหมอนคั่นระหว่างขา ขาเหยียดตรง หลีกเลี่ยง hip flexion เกิน 90°, adduction, internal rotation [สรุป]", "t": "THA"}, {"f": "เกณฑ์เสี่ยง pulmonary embolism หลัง THA ที่ต้องรายงานแพทย์คือค่าใด?", "b": "RR มากกว่า 30, O2sat น้อยกว่า 95 ให้จัดท่าศีรษะสูง 45° และให้ O2 cannula 3 L/min [สรุป]", "t": "THA"}, {"f": "เกณฑ์ติดเชื้อแผล/ข้อเทียมหลัง THA ที่ใช้ติดตามคือค่าใด?", "b": "T มากกว่า 37.5°C, ESR มากกว่า 20, CRP มากกว่า 5 ให้ใช้ sterile technique และ ATB prophylaxis ป้องกัน [สรุป]", "t": "THA"}, {"f": "Hemiarthroplasty ต่างจาก Total Hip Arthroplasty อย่างไร?", "b": "Hemiarthroplasty เปลี่ยนเฉพาะกระดูกต้นขา เสียเวลา/เลือดน้อยกว่า ส่วน THA เปลี่ยนทั้ง acetabular cup, femoral head, stem และ liner แก้พยาธิสภาพได้ทั้งเบ้า+หัวต้นขาแต่เสียเวลา/เลือดมากกว่า [สรุป]", "t": "THA"}, {"f": "ข้อจำกัดของการผ่าตัดเปลี่ยนข้อสะโพกเทียมมีอะไรบ้าง?", "b": "โรคร่วมหลายอย่าง, ร่างกายติดเชื้อ, ข้อติดแข็งแต่ยังใช้ได้ดี, กล้ามเนื้อรอบข้ออ่อนแรงพยุงไม่ได้เช่น Myasthenia gravis [สรุป]", "t": "THA"}, {"f": "การประเมินความเสี่ยง DVT หลัง THA ต้องสังเกตอาการและใช้อุปกรณ์ใด?", "b": "สังเกต dorsalis pedis pulse, บวมตึง, ปวดน่อง ใช้ IPCD และจัดท่าไม่ให้ขาเหยียดเกิน [สรุป]", "t": "THA"}, {"f": "อาการ/สัญญาณของโรคข้อสะโพกที่ต้องผ่าตัดเปลี่ยนข้อคืออะไร?", "b": "ปวดข้อสะโพกเมื่อเดินลงน้ำหนัก ปวดที่ขาหนีบ/ต้นขาด้านหน้า-ด้านใน ตรวจโดย internal rotation บางรายพบขาสั้นลง [สรุป]", "t": "THA"}, {"f": "ประเด็นปัญหาทางการพยาบาลผู้ป่วย THA ที่ประเมินจาก pain score เท่าใด ต้องให้ยาลดปวด?", "b": "Pain score มากกว่า 3 พร้อมสีหน้าเจ็บปวด ให้ยาลดปวดและอาจใช้ periarticular injection [สรุป]", "t": "THA"}, {"f": "Tranexamic acid ใช้ในผู้ป่วย THA เพื่อวัตถุประสงค์ใด?", "b": "ลดการเสียเลือดระหว่าง/หลังผ่าตัด ให้เมื่อประเมินว่ามี active bleeding หรือเสี่ยงเสียเลือดมาก [สรุป]", "t": "THA"}, {"f": "การจัดท่าป้องกัน DVT ในผู้ป่วย THA ต้องหลีกเลี่ยงท่าใด?", "b": "หลีกเลี่ยงการจัดท่าให้ขาเหยียดเกิน เพราะทำให้หลอดเลือดดำยืด-แฟบ เลือดไหลไม่สะดวก เพิ่มความเสี่ยง DVT [สรุป]", "t": "THA"}, {"f": "TKA ประกอบด้วยชิ้นส่วนอะไรบ้าง และงอเข่าได้กี่องศาหลังผ่าตัด?", "b": "Femoral, tibial, patellar component รวมกับ polyethylene insert งอได้ 125-130° [สไลด์]", "t": "TKA"}, {"f": "เกณฑ์การเคลื่อนย้ายผู้ป่วยออกจากห้องผ่าตัดหลัง TKA คือค่าใด?", "b": "SpO2 มากกว่า 98% และ O2 5 L/min [สไลด์]", "t": "TKA"}, {"f": "Verbal report ส่งเวรหลัง TKA ต้องครอบคลุมกี่หัวข้อ อะไรบ้าง?", "b": "9 หัวข้อ คือ Patient's identification, Operation, Side, Allergy, Vital signs, Anaesthetic, IV fluid, Bleeding, Urine [สไลด์]", "t": "TKA"}, {"f": "ยาที่ใช้จริงในห้องผ่าตัด TKA ตามภาพสไลด์มีอะไรบ้าง และแต่ละตัวมีบทบาทอย่างไร?", "b": "Cefazolin คือ ATB prophylaxis, Tranexamic acid คือลดเลือดออก, Marcaine 0.5% คือยาชา periarticular, Ketorolac คือ NSAID ฉีดลดปวด [สไลด์]", "t": "TKA"}, {"f": "Unicompartmental knee arthroplasty ต่างจาก Total knee arthroplasty อย่างไร?", "b": "Unicompartmental เปลี่ยนบางส่วนหรือข้อเดียวของเข่า ส่วน Total knee arthroplasty เปลี่ยนทั้งข้อ [สไลด์]", "t": "TKA"}, {"f": "Risk factors ของข้อเข่าเสื่อมที่นำไปสู่การผ่าตัด TKA มีอะไรบ้าง?", "b": "Arthritis, อายุ, เพศ, ภาวะอ้วน, พันธุกรรม, การบาดเจ็บเข่าซ้ำ [สไลด์]", "t": "TKA"}, {"f": "ตัวอย่าง Arthritis 2 ชนิดที่สไลด์แสดงภาพประกอบสำหรับผู้ป่วย TKA คืออะไร?", "b": "Rheumatoid arthritis ที่มี pannus formation รุกล้ำกระดูกอ่อน และ Gout knee ที่มี uric acid สะสมในข้อ [สไลด์]", "t": "TKA"}, {"f": "Prophylactic antibiotic ก่อนผ่าตัด TKA ต้องให้ภายในกี่นาทีก่อน incision?", "b": "ภายใน 60 นาทีก่อน incision และ redose หลัง 3-4 ชั่วโมงหรือเมื่อเสียเลือดมาก [จริง]", "t": "TKA"}, {"f": "MIS-TKA คืออะไร และ Mobile bearing คืออะไร?", "b": "MIS-TKA คือ Minimal Invasive Surgery TKA แผลเล็ก รุกล้ำกล้ามเนื้อน้อย ฟื้นตัวเร็ว ส่วน Mobile bearing คือชิ้นรองที่เคลื่อนได้เลียนแบบการหมุนตามธรรมชาติของเข่า [สไลด์]", "t": "TKA"}, {"f": "ระยะการพยาบาลผู้ป่วย TKA เรียงตามสไลด์มีกี่ระยะ อะไรบ้าง?", "b": "Pre-Admission nurse ตามด้วย Preoperative assessment ตามด้วย OR preparation ตามด้วย Intra-operative phase ตามด้วยการเคลื่อนย้ายออกจากห้องผ่าตัด และ Post-operative Care [สไลด์]", "t": "TKA"}, {"f": "อุปกรณ์ cold therapy หลังผ่าตัด TKA ใช้เพื่ออะไร และวางตำแหน่งอย่างไร?", "b": "Cryo-cuff พันรอบเข่า ระบุจุดวาง place opening behind knee ต่อสายไปเครื่องทำความเย็นเพื่อลดบวมและปวด [สไลด์]", "t": "TKA"}, {"f": "การรักษาข้อเข่าเสื่อมแบบ Conservative ก่อนผ่าตัด TKA ประกอบด้วยอะไรบ้าง?", "b": "Non-medication เช่น PT ออกกำลังกาย ลดน้ำหนัก และ Medication เช่น NSAIDs [สไลด์]", "t": "TKA"}, {"f": "ระหว่างผ่าตัด TKA ใช้เครื่องมือไฟฟ้า/ลมชนิดใดในการตัดกระดูก?", "b": "Oscillating saw และ power drill [สไลด์]", "t": "TKA"}, {"f": "ไหมเย็บที่ใช้ปิดแผล TKA ตามภาพสไลด์มีชนิดใดบ้าง?", "b": "Stratafix, Vicryl Plus, Monocryl [สไลด์]", "t": "TKA"}, {"f": "หลังเคลื่อนย้ายผู้ป่วย TKA ออกจากห้องผ่าตัด ทำไมต้องยกขาสูงด้วยหมอนหลายใบ?", "b": "เพื่อลดอาการบวมของขาที่ผ่าตัด [สไลด์]", "t": "TKA"}, {"f": "CHD แบ่งเป็น 3 กลุ่มหลักตามพยาธิสรีรวิทยา อะไรบ้าง?", "b": "Acyanotic คือ left-to-right shunt, Cyanotic คือ right-to-left shunt/mixing, Obstructive คือการตีบ/อุดกั้น [สไลด์]", "t": "CHD surgery"}, {"f": "Closed Heart Surgery กับ Open Heart Surgery แบ่งกันตามเกณฑ์ใด?", "b": "แบ่งตามการใช้ Cardiopulmonary Bypass ใช้เครื่องปอด-หัวใจเทียมคือ Open Heart Surgery ไม่ใช้คือ Closed Heart Surgery ไม่ใช่แบ่งตามการเปิด/ไม่เปิดหัวใจ [คาบ]", "t": "CHD surgery"}, {"f": "ตัวอย่างหัตถการ Closed Heart Surgery มีอะไรบ้าง?", "b": "PDA ligation, MBTS, Coarctation repair, PA banding [สไลด์]", "t": "CHD surgery"}, {"f": "Modified Blalock-Taussig Shunt ใช้ท่ออะไรเชื่อมระหว่างหลอดเลือดใด?", "b": "ใช้ Gore-Tex graft เชื่อมระหว่าง subclavian artery กับ pulmonary artery แทนการตัด subclavian artery มาต่อโดยตรงแบบ classic BT shunt เดิม [สไลด์]", "t": "CHD surgery"}, {"f": "Cardioplegia solution ทำให้หัวใจหยุดเต้นได้อย่างไร?", "b": "เป็นสารละลายโพแทสเซียมเข้มข้นสูงและเย็นที่ 4°C ฉีดเข้า aortic root ให้วิ่งเข้า coronary artery โดยตรง ทำให้กล้ามเนื้อหัวใจ bradycardia แล้วหยุดเต้นเป็น asystole [คาบ]", "t": "CHD surgery"}, {"f": "ก่อนเริ่ม Cardiopulmonary Bypass ต้องให้ยาอะไร และตรวจค่าใดยืนยัน?", "b": "ให้ heparin ทั่วร่างกาย ตรวจยืนยันด้วยค่า ACT ก่อนเริ่ม bypass [เสริม]", "t": "CHD surgery"}, {"f": "หลังหย่าเครื่อง CPB สำเร็จ ต้องให้ยาอะไรเพื่อ reverse ฤทธิ์ heparin?", "b": "Protamine sulfate ถ้าไม่ reverse เลือดจะไม่แข็งตัวเสี่ยง bleed รุนแรง [คาบ]", "t": "CHD surgery"}, {"f": "ASD ชนิด Ostium secundum พบตำแหน่งใด และพบบ่อยเท่าใดของ ASD ทั้งหมด?", "b": "อยู่กลาง septum บริเวณ fossa ovalis พบบ่อยที่สุดประมาณ 70% ของ ASD ทั้งหมด [เสริม]", "t": "CHD surgery"}, {"f": "VSD ชนิด Perimembranous พบตำแหน่งใด และพบบ่อยเท่าใดของ VSD ทั้งหมด?", "b": "บริเวณ membranous septum ใกล้ AV valve พบบ่อยที่สุดประมาณ 80% ของ VSD ทั้งหมด [เสริม]", "t": "CHD surgery"}, {"f": "AVSD สัมพันธ์กับโรคทางพันธุกรรมใดบ่อยที่สุด?", "b": "Down syndrome (Trisomy 21) [จริง]", "t": "CHD surgery"}, {"f": "HLHS ต้องให้ยาอะไรเพื่อคง PDA ให้เปิดก่อนผ่าตัด?", "b": "Prostaglandin E1 เพราะถ้า PDA ปิด ผู้ป่วยจะเสียชีวิตอย่างรวดเร็วจากไม่มีเลือดไป systemic circulation [จริง]", "t": "CHD surgery"}, {"f": "Staged Single-Ventricle Palliation สำหรับ HLHS มี 3 ขั้นตอนอะไรบ้าง เรียงตามลำดับ?", "b": "Norwood procedure ในสัปดาห์แรกของชีวิต ตามด้วย Bidirectional Glenn shunt ที่ 4-6 เดือน และ Fontan procedure เมื่ออายุ 2 ปีขึ้นไป [สไลด์]", "t": "CHD surgery"}, {"f": "4 ลักษณะสำคัญของ Tetralogy of Fallot มีอะไรบ้าง?", "b": "Ventricular Septal Defect, Pulmonary Stenosis (RVOTO), Overriding Aorta, Right Ventricular Hypertrophy [สไลด์]", "t": "CHD surgery"}, {"f": "Transannular patch กับ Non-transannular patch ในการซ่อม RVOT ของ TOF ต่างกันอย่างไร?", "b": "Transannular ตัดผ่าน pulmonary valve annulus แก้ obstruction ได้เต็มที่แต่เสี่ยง pulmonary regurgitation เรื้อรัง ส่วน Non-transannular คง native valve ไว้ลดความเสี่ยง PR แต่ทำได้เฉพาะเมื่อ annulus ไม่ hypoplastic มาก [สไลด์]", "t": "CHD surgery"}, {"f": "Norwood with BT shunt ต่างจาก Norwood with Sano shunt อย่างไรในแง่ diastolic runoff?", "b": "BT shunt มี diastolic runoff ทำให้ diastolic BP ต่ำ ส่วน Sano shunt ไม่มี diastolic runoff เพราะเลือดไปปอดเฉพาะช่วง systole [จริง]", "t": "CHD surgery"}, {"f": "ระยะเวลาที่หัวใจทนต่อ aortic cross-clamp ได้โดยทั่วไปตามที่อาจารย์เน้นในคาบคือเท่าใด?", "b": "ประมาณ 4 ชั่วโมง สั้นกว่านั้นได้ยิ่งดี ยาวถึง 6-7 ชั่วโมงถือว่าเสี่ยงมาก [คาบ]", "t": "CHD surgery"}, {"f": "Deep Hypothermic Circulatory Arrest ทำให้สมองทนต่อภาวะหยุดไหลเวียนเลือดสนิทได้นานเท่าใด?", "b": "ประมาณ 30 นาที โดยคูลร่างกายลงถึง 15°C และติด EEG monitor [คาบ]", "t": "CHD surgery"}, {"f": "สมการหลักที่อธิบายความดันโลหิตในห้องผ่าตัดคืออะไร?", "b": "BP เท่ากับ HR คูณ SV คูณ SVR ใช้อธิบายสาเหตุความดันตกได้เกือบทุกกรณี [สไลด์]", "t": "Heart & Aortic"}, {"f": "เส้นเลือด LAD อุดตันเรียกว่าอะไร เพราะเลี้ยงส่วนใดของหัวใจ?", "b": "เรียก widow maker เพราะเลี้ยงผนังหน้าส่วนใหญ่ของ LV [สไลด์]", "t": "Heart & Aortic"}, {"f": "อาการเจ็บหน้าอกแบบ Stable angina, NSTEMI/unstable angina, STEMI ต่างกันอย่างไร?", "b": "Stable angina เจ็บออกแรงหายใน 5-10 นาที NSTEMI/unstable angina เจ็บขณะพักนานกว่า 20 นาที troponin ขึ้น STEMI เส้นเลือดอุดตันสมบูรณ์ ST ยก ต้อง PCI ทันที [สไลด์]", "t": "Heart & Aortic"}, {"f": "ผู้ป่วยลิ้นหัวใจตีบรุนแรงหลังเริ่มมีอาการหัวใจล้มเหลว มีอายุขัยเฉลี่ยเท่าใดถ้าไม่รักษา?", "b let META={"Competency in OR": 17, "ODS": 15, "MIS": 17, "URO anatomy": 17, "Periop URO": 15, "Lower Extremity": 17, "GI Surgical Staple": 15, "THA": 15, "TKA": 15, "CHD surgery": 17, "Heart & Aortic": 17, "Periop Cardiothoracic": 17};
let deck=CARDS, seq=[], pos=0;
const byTag=key=>document.getElementById(key);
function select(f){deck=(f==='all')?CARDS.slice():CARDS.filter(c=>c.t===f);seq=[...Array(deck.length).keys()];pos=0;document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('sel'));const b=[...document.querySelectorAll('.fbtn')].find(x=>x.dataset.v===f);if(b)b.classList.add('sel');render();}
function render(){if(!deck.length)return;const c=deck[seq[pos]];byTag('front').innerHTML=md(c.f);byTag('back').innerHTML=md(c.b);byTag('cradtag').textContent=c.t;byTag('cside').textContent='หน้า';byTag('back').style.display='none';byTag('front').style.display='';byTag('hint').style.display='';byTag('prog').textContent='การ์ด '+(pos+1)+'/'+deck.length+' · '+c.t;}
function md(t){return t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');}
function flip(){const fr=byTag('front'),bo=byTag('back');if(bo.style.display==='none'){fr.style.display='none';bo.style.display='';byTag('cside').textContent='หลัง';byTag('hint').style.display='none';}else{bo.style.display='none';fr.style.display='';byTag('cside').textContent='หน้า';byTag('hint').style.display='';}}
const fb=byTag('filters');
[['ทั้งหมด','all'],...Object.keys(META).map(t=>[t,t])].forEach(([label,val])=>{const b=document.createElement('button');b.className='fbtn';b.dataset.v=val;b.textContent=label;b.onclick=()=>select(val);fb.appendChild(b);});
byTag('card').onclick=flip;byTag('next').onclick=()=>{if(!deck.length)return;pos=(pos+1)%deck.length;render();};byTag('prev').onclick=()=>{if(!deck.length)return;pos=(pos-1+deck.length)%deck.length;render();};
byTag('shuf').onclick=()=>{for(let i=seq.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[seq[i],seq[j]]=[seq[j],seq[i]];}pos=0;render();};
byTag('rord').onclick=()=>{seq.sort((a,b)=>a-b);pos=0;render();};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown')byTag('next').click();else if(e.key==='ArrowLeft'||e.key==='ArrowUp')byTag('prev').click();else if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();}});
select('all');
</script></body></html>
