<script>const CARDS=[{"f": "ที่มา", "b": "แนวคิดเกิดขึ้นช่วงปี 1970 โดย **David McClelland** (20 พ.ค. 1917 – 27 มี.ค. 1998) นักจิตวิทยาชาวอเมริกัน ศึกษาว่าทำไมคนตำแหน่งเดียวกันมีผลงานต่างกัน [สไลด์]", "t": "Competency in OR"}, {"f": "นิยาม McClelland", "b": "บุคลิกลักษณะที่ซ่อนอยู่ภายในแต่ละบุคคลซึ่งผลักดันให้สร้างผลการปฏิบัติงานที่ดีหรือตามเกณฑ์ที่กำหนด [สไลด์]", "t": "Competency in OR"}, {"f": "นิยามเพิ่ม", "b": "คุณลักษณะของบุคคลที่แสดงพฤติกรรมและความคิดอย่างต่อเนื่อง...เชื่อมโยงกับผลการปฏิบัติงานที่ดีเยี่ยม; \"คุณลักษณะที่มีผลต่อพฤติกรรมและผลการปฏิบัติงาน ประกอบด้วยทักษะ ความรู้ ความสามารถ ทัศนคติ บุคลิกภาพ ค่านิยม\" [สไลด์]", "t": "Competency in OR"}, {"f": "นิยาม สนง. ก.พ. (2553)", "b": "กลุ่มของความรู้ ความสามารถ ทักษะ ทัศนคติที่จำเป็นในการทำงานได้อย่างมีประสิทธิภาพและประสิทธิผล [สไลด์]", "t": "Competency in OR"}, {"f": "**Iceberg Model** (อ้างอิง David C. McClelland - Lyle M. Spencer, Jr.)", "b": "ส่วนบนน้ำ (มองเห็นง่าย) = ความรู้ (Knowledge) + ทักษะ (Skill); ส่วนใต้น้ำ (มองเห็นยาก) = Social Role, Self-Image, Trait, Motives [สไลด์]", "t": "Competency in OR"}, {"f": "แหล่ง", "b": "หนังสือ \"สมรรถนะพยาบาลห้องผ่าตัด (Perioperative Nurse Competencies)\" สมาคมพยาบาลห้องผ่าตัดแห่งประเทศไทย พ.ศ. 2554 (ISBN 978-974-350-657-4) [สไลด์]", "t": "Competency in OR"}, {"f": "นิยาม Competency ในหนังสือนี้อ้างอิงหลายแหล่ง", "b": "Cambridge International Dictionary (1995), JCAHO (1993 อ้างใน Gruendemann and Fernsebnee, 1995), AORN (1999) [สไลด์]", "t": "Competency in OR"}, {"f": "ประเภทสมรรถนะตามจิรประภา อัครบวร (2549)", "b": "Core competency / Functional competency (2 ประเภท — คนละกรอบกับ Core/Technical/Non-Technical ของสไลด์นี้เอง) [สไลด์]", "t": "Competency in OR"}, {"f": "ด้าน 1 (ความปลอดภัย)", "b": "ป้องกันบาดเจ็บเนื้อเยื่อจาก สารเคมี / เครื่องจี้ไฟฟ้า / รังสี / การเคลื่อนย้าย / การจัดท่า", "t": "Competency in OR"}, {"f": "ด้าน 2 (ร่างกาย)", "b": "ป้องกันติดเชื้อ, การกำซาบเนื้อเยื่อ, อุณหภูมิกาย, สมดุลสารน้ำ/อิเลคโทรไลท์/กรดด่าง, ระบบหัวใจ-หลอดเลือด, จัดการความปวด", "t": "Competency in OR"}, {"f": "ด้าน 3 (ตอบสนองพฤติกรรม)", "b": "ให้ความรู้ผู้ป่วย/ญาติ, จริยธรรมและพิทักษ์สิทธิผู้ป่วย", "t": "Competency in OR"}, {"f": "ด้าน 4 (ระบบสุขภาพ)", "b": "ความเป็นวิชาชีพ, ปฏิบัติตามนโยบาย/มาตรฐานหน่วยงาน, สนับสนุนเป้าหมายองค์กร", "t": "Competency in OR"}, {"f": "หมายเหตุแยกกรอบ", "b": "สนง.ก.พ. มี **สมรรถนะหลักภาครัฐ 5 ด้าน** ต่างหาก (ดูตาราง 3) — คนละกรอบกับ Core/Technical/Non-Technical ของหน่วยงาน ห้ามปนกัน [สไลด์]", "t": "Competency in OR"}, {"f": "โครงสร้าง 3 กลุ่มงาน Technical Competency การพยาบาลผ่าตัด", "b": "**กลุ่ม 1** หน่วยผ่าตัด (Circulating nurse / Scrub nurse / บริหารจัดการเครื่องมือผ่าตัด), **กลุ่ม 2** หน่วยพักฟื้นก่อน-หลังผ่าตัด (PACU), **กลุ่ม 3** หน่วยตรวจด้วยเครื่องมือพิเศษ [สไลด์]", "t": "Competency in OR"}, {"f": "PL1", "b": "ปฏิบัติตาม WI ถูกต้อง (นับผ้าซับโลหิต/ของมีคม, ล้างมือ, เปิดห่อปลอดเชื้อ, Aseptic/Sterile technique)", "t": "Competency in OR"}, {"f": "PL2", "b": "รู้โรค/แนวทางรักษาในขอบเขตหน่วยงาน (พยาธิสรีรภาพ, จัด Position, ยา/สารน้ำ, ป้องกันแทรกซ้อนเช่นสูญเสียความร้อน, จัดเตรียมเครื่องมือพื้นฐาน)", "t": "Competency in OR"}, {"f": "PL3", "b": "ประเมินปัญหา ตัดสินใจจัดการสถานการณ์ด้วยตนเอง (Circulating/Scrub nurse ภายใต้พี่เลี้ยง)", "t": "Competency in OR"}, {"f": "PL4", "b": "วางแผน/ให้การพยาบาลองค์รวมเหมาะสมรายบุคคล, จัดลำดับความสำคัญ (Early detection เช่น ป้องกัน hypothermia, preoperative visit)", "t": "Competency in OR"}, {"f": "PL5", "b": "คาดการณ์/ตัดสินใจแก้ปัญหาสอดคล้องผู้ป่วยแต่ละราย, บูรณาการความรู้ใหม่ (Case management, CQI, Best practice, Innovation, Research)", "t": "Competency in OR"}, {"f": "นิยาม", "b": "ทักษะรอบด้าน (กระบวนการคิด สื่อสาร ทักษะสังคม) ร่วมกับ technical skill เพื่อลดผิดพลาด เพิ่มความปลอดภัย; **เรียนรู้/ฝึกได้หลังมีประสบการณ์ทำงานในห้องผ่าตัดแล้วเท่านั้น** ไม่ใช่ก่อนเข้าปฏิบัติงานจริง [สไลด์]", "t": "Competency in OR"}, {"f": "ANTS", "b": "วิสัญญีแพทย์", "t": "Competency in OR"}, {"f": "NOTSS", "b": "ศัลยแพทย์", "t": "Competency in OR"}, {"f": "SPINTS", "b": "พยาบาลส่งเครื่องมือ", "t": "Competency in OR"}, {"f": "SPINTS หมวดย่อย", "b": "Situation awareness (Gathering info / Recognizing&understanding / Anticipating), Communication&teamwork (Acting assertively / Exchanging info / Coordinating), Task management (Planning&preparing / Providing&maintaining standards / Coping with pressure) [สไลด์]", "t": "Competency in OR"}, {"f": "งานวิจัยอ้างอิง", "b": "การสังเกตพฤติกรรม Non-technical skill ของพยาบาลส่งเครื่องมือผ่าตัด; Redaelli I. \"Nontechnical skills of the operating theatre circulating nurse: An ethnographic study\" (J Adv Nurs, 2018); Kalantari R. et al. \"Development and psychometric evaluation of a behavioral marker system for circulating nurse's non-technical skills\" (Perioperative Care and Operating Room Management, 2021) [สไลด์]", "t": "Competency in OR"}, {"f": "นิยาม", "b": "การเทียบเคียงความสามารถของผู้ถูกประเมินตามตำแหน่ง บทบาทหน้าที่ ความรับผิดชอบ และความก้าวหน้าในอาชีพ [สไลด์]", "t": "Competency in OR"}, {"f": "วิธีประเมิน", "b": "**Audit, Certification/Training, CQI/PI, Interview, Observation, Testing** [สไลด์]", "t": "Competency in OR"}, {"f": "เครื่องมือ", "b": "แบบวัดความรู้ (ข้อสอบ), แบบวัดทัศนคติ, แบบวัดการปฏิบัติ [สไลด์]", "t": "Competency in OR"}, {"f": "ความถี่", "b": "**ปีละ 1 ครั้ง** เพื่อพัฒนาสมรรถนะให้มีประสิทธิภาพสูงอยู่เสมอ [สไลด์]", "t": "Competency in OR"}, {"f": "แผนพัฒนา", "b": "(1) ผู้รับการประเมินกำหนดเอง (2) ผู้บังคับบัญชากำหนดตามความจำเป็น/ความเร่งด่วน/Schedule อบรม [สไลด์]", "t": "Competency in OR"}, {"f": "JD พยาบาลผ่าตัดแบ่ง 3 ช่วง", "b": "**ก่อนผ่าตัด / ระหว่างผ่าตัด / หลังผ่าตัด** [สไลด์]", "t": "Competency in OR"}, {"f": "โครงการพัฒนาบุคลากร", "b": "โครงการเตรียมความพร้อมก่อนปฏิบัติงาน, โครงการพัฒนาศักยภาพพยาบาลห้องผ่าตัด, โครงการอบรมเฉพาะทางสาขาต่างๆ, Residency Training Program [สไลด์]", "t": "Competency in OR"}, {"f": "David McClelland", "b": "20 พ.ค. 1917 – 27 มี.ค. 1998, นักจิตวิทยาอเมริกัน, เริ่มแนวคิด Competency ปี 1970 [สไลด์]", "t": "Competency in OR"}, {"f": "สมรรถนะพยาบาลห้องผ่าตัด 4 ด้าน", 5 ด้าน: มุ่งผลสัมฤทธิ์ / บริการที่ดี / สั่งสมความเชี่ยวชาญในงานอาชีพ / ยึดมั่นความถูกต้องชอบธรรมและจริยธรรม / ทำงานเป็นทีม [สไลด์]", "t": "Competency in OR"}, {"f": "สภาการพยาบาล ประกาศสมรรถนะหลัก", "b": "ประกาศ ณ 23 ก.พ. 2561 อาศัยมาตรา 22(1),23(1)(ก) พรบ.วิชาชีพการพยาบาลฯ 2528 (แก้ไขฉบับที่2 พ.ศ.2540) [สไลด์]", "t": "Competency in OR"}, {"f": "Job Description พยาบาลผ่าตัด", "b": "ก่อนผ่าตัด / ระหว่างผ่าตัด / หลังผ่าตัด [สไลด์]", "t": "Competency in OR"}, {"f": "อ้างอิง", "b": "Kroh M. Innovations and New Technologies in Gastrointestinal Surgery. Med UNAB, 2022;25(3):461-469", "t": "MIS"}, {"f": "Benefits of **ICG & Fluorescence Imaging** ใน Lap Hepatectomy", "b": "(1) Improved tumor identification (2) Accurate segmental resection (3) Enhances safety (เห็น critical vascular structures real-time)", "t": "MIS"}, {"f": "Robotic Instruments Preparation", "b": "cannula 8 mm, 5-8 mm cannula seal, gage pin test", "t": "MIS"}, {"f": "Robotic Endoscope Preparation", "b": "8 mm endoscopes, ใช้ Antifog, **ห้ามใช้ warming liquid เกิน 55°C**", "t": "MIS"}, {"f": "Inventory Management", "b": "single-use devices, ตรวจสอบผ่าน touchscreen ใต้ setting tab, ต้องมี tracking system (barcode/RFID/ระบบดิจิทัล) และ preventive maintenance", "t": "MIS"}, {"f": "Standardize Instrument Tray", "b": "Spatula, L-hook, Endoclinch, Marryland, Bowel clamp, Grasper, Scissors", "t": "MIS"}, {"f": "Reprocessing", "b": "Cleaning/Pre-cleaning ทันทีหลังใช้ด้วย enzymatic detergent+น้ำกลั่น (ห้ามใช้แปรงแข็ง/น้ำร้อนจัด); Disinfection & Sterilization: Low-temperature sterilization (Hydrogen peroxide plasma, E.O.) หรือ Steam sterilization (เฉพาะเครื่องมือทนความร้อน)", "t": "MIS"}, {"f": "Extreme positioning", "b": "gravitational effect ทำให้อวัยวะเคลื่อนออกจาก surgical field; risk factors: old age, coexisting cardiac/pulmonary disease", "t": "MIS"}, {"f": "ผลต่อร่างกาย", "b": "เพิ่ม risk of CO2 retention, intracranial pressure, intraocular pressure, mean arterial pressure", "t": "MIS"}, {"f": "Super obesity patient", "b": "โต๊ะผ่าตัดใหญ่ขึ้น, foot board (reverse Trendelenburg 12-15°), safety strap พิเศษ (extra wide & long), laparoscopic instruments ยาวขึ้น (43-44 cm), เจ้าหน้าที่เพียงพอสำหรับ \"**2P safety**\" (การเคลื่อนย้ายผู้ป่วย) [สไลด์]", "t": "MIS"}, {"f": "Supine-Arm Wrapping", "b": "ต้อง tuck แขนให้ถูกตำแหน่ง (ไม่ยื่นเกิน OR Bed Platform) — อ้างอิง AORN 2023 \"Best Practices for Safe Perioperative Patient Positioning\" [สไลด์]", "t": "MIS"}, {"f": "อุปกรณ์ป้องกัน Pressure injury", "b": "Prophylactic Foam Dressing (multi-layer), Gel, Bean bag, OR Table pads, Pressure Reduction System (PRS); Normothermia: Warming mattress, Force air warmer, Warm irrigation, Warm CO2 Gas, Room Temp 20-22°C", "t": "MIS"}, {"f": "MEWS PI", "b": "ใช้ KPI การประเมิน pressure injury; Bundle ป้องกันมี 4 องค์ประกอบ: Maintenance of normothermia, Special padding, Positioning devices, Polyurethane foam dressing [สไลด์]", "t": "MIS"}, {"f": "Risk assessment (AORN, 2017)", "b": "Laparoscopic surgery + Lithotomy position + **Operative time > 3 ชั่วโมง** + risk factor (old age, obesity)", "t": "MIS"}, {"f": "อาการ DVT", "b": "บวมขา, ปวด/กดเจ็บ, ผิวหนังอุ่น, ผิวแดง/เปลี่ยนสี", "t": "MIS"}, {"f": "อาการ Pulmonary Embolism", "b": "หายใจสั้น, เจ็บหน้าอกเฉียบพลัน, วิงเวียน, หัวใจเต้นผิดจังหวะ, ไอเป็นเลือด", "t": "MIS"}, {"f": "Intervention", "b": "sequential pneumatic compression device", "t": "MIS"}, {"f": "Contraindication ของ mechanical VTE prophylaxis (NCCN, 2015)", "b": "platelet < 20,000 (severe thrombocytopenia), แผลเปิด/dermatitis/vein ligation/gangrene/recent skin graft ที่ขา, severe arteriosclerosis หรือ ischemic vascular disease, massive edema ขาหรือ pulmonary edema จาก CHF, extreme leg deformity/varicose vein, มี DVT/PE/thrombophlebitis มาก่อนใน 6 เดือน [สไลด์]", "t": "MIS"}, {"f": "ผลกระทบ", "b": "Shivering, เพิ่ม oxygen consumption, เพิ่ม workload ของ myocardium", "t": "MIS"}, {"f": "ปัจจัย", "b": "Insufflated CO2 temp 15-22°C (ขึ้นกับเวลา/flow rate), Irrigation fluid temperature", "t": "MIS"}, {"f": "**งานวิจัยหลัก** (Wongyingsinn M, et al. BMC Anesthesiology 2023;23:137)", "b": "n=742 ราย, postoperative hypothermia **11.9%**; กลุ่ม monitor intraoperative core temp (n=117) พบ intraoperative hypothermia **73.5%**; ปัจจัยสัมพันธ์กับ postoperative hypothermia: ASA physical status III-IV (**OR=1.78**), preoperative hypothermia (**OR=17.99**) [สไลด์]", "t": "MIS"}, {"f": "วิธีป้องกัน", "b": "warming/humidification ของ anesthetic gases, warming IV/irrigation fluids, warming mattress; **forced-air warming blankets/devices \"ไม่แนะนำ\"** เพราะมีหลักฐานเพิ่มความเสี่ยงติดเชื้อ (Koc BB, et al. Orthop Nurs 2017;33(1):356-60) [สไลด์]", "t": "MIS"}, {"f": "Siriraj audit ผล keep core temp > 36°C", "b": "ปี 2567 = **69.84%**; เม.ย.-มิ.ย. 2568 = **82.61% (38/46 ราย)**; core temp < 36°C พบ **5 ราย (21.05%)** [สไลด์]", "t": "MIS"}, {"f": "ข้อควรระวัง", "b": "Insufflator ต้องอยู่สูงกว่า surgical cavity (ป้องกัน cross contamination); insufflation tubing ต้อง flush ด้วยแก๊สก่อนต่อ cannula (ลด air embolism); ใช้ single-use hydrophobic filter", "t": "MIS"}, {"f": "CO2 pneumoperitoneum ความเสี่ยง", "b": "Hypercarbia, CO2 retention, Subcutaneous emphysema, Hypothermia, Shoulder pain, CO2 embolism", "t": "MIS"}, {"f": "Monitoring", "b": "**ETCO2 ค่าปกติ 35-45 mmHg**", "t": "MIS"}, {"f": "อาการ CO2 embolism", "b": "ความดันเลือดลดฮวบ, ETCO2 ลดฮวบ, O2 saturation ลดเร็ว", "t": "MIS"}, {"f": "Intervention CO2 embolism", "b": "หยุด CO2 insufflation, จัด Trendelenburg position, NSS irrigation, ใส่ central line", "t": "MIS"}, {"f": "การศึกษา (Montero et al, 2010)", "b": "ตรวจสอบ laparoscopic instruments แบบใช้ซ้ำ **165 ชิ้น** พบ insulation failure **19%** → แนะนำตรวจสอบเป็นประจำด้วย Insulation failure tester [สไลด์]", "t": "MIS"}, {"f": "Goals of SiERAS", "b": "ลด stress response หลังผ่าตัด, เร่ง recovery, กลับสู่ function ก่อนรับการรักษาหรือดีกว่า, ผู้ป่วยพึงพอใจเมื่อจำหน่าย", "t": "MIS"}, {"f": "ERAS Standardize protocols", "b": "ERAS HPB intra-operative phase — บทบาท OR nurse; มีการเก็บข้อมูลต่อเนื่อง audit ปรับปรุง protocol", "t": "MIS"}, {"f": "Patient safety concern 5 ข้อ", "b": "positioning / pressure injury / DVT / pneumoperitoneum / hypothermia [สไลด์]", "t": "MIS"}, {"f": "Lithotomy elevation effect", "b": "ทุก 1 ฟุตเหนือ aorta → ankle pressure ลด ~20 mmHg [สไลด์]", "t": "MIS"}, {"f": "Super obese: reverse Trendelenburg", "b": "12-15° [สไลด์]", "t": "MIS"}, {"f": "Super obese: instrument length", "b": "43-44 cm [สไลด์]", "t": "MIS"}, {"f": "OR bed mattress pad", "b": "8 cm และ 4.5 cm [สไลด์]", "t": "MIS"}, {"f": "Room temp แนะนำ", "b": "20-22°C [สไลด์]", "t": "MIS"}, {"f": "Insufflated CO2 temp", "b": "15-22°C [สไลด์]", "t": "MIS"}, {"f": "DVT risk (AORN 2017)", "b": "Lap surgery + Lithotomy + operative time > 3 ชม. + old age/obesity [สไลด์]", "t": "MIS"}, {"f": "VTE prophylaxis contraindication (NCCN 2015)", "b": "platelet < 20,000 และอื่นๆ (ดูรายละเอียด 2.7) [สไลด์]", "t": "MIS"}, {"f": "Hypothermia study (Wongyingsinn 2023)", "b": "n=742, postop incidence 11.9%; n=117 intraop 73.5%; OR ASA III-IV=1.78; OR preop hypothermia=17.99 [สไลด์]", "t": "MIS"}, {"f": "Warmed/humidified CO2 → core temp", "b": "เพิ่มเฉลี่ย 0.3°C (Dean M, 2017) [สไลด์]", "t": "MIS"}, {"f": "Forced-air warming ไม่แนะนำ (เพิ่ม infection risk)", "b": "Koc BB, Orthop Nurs 2017;33(1):356-60 [สไลด์]", "t": "MIS"}, {"f": "Siriraj keep core temp >36°C", "b": "ปี 2567=69.84%; เม.ย.-มิ.ย.68=82.61%(38/46); <36°C=5ราย(21.05%) [สไลด์]", "t": "MIS"}, {"f": "ETCO2 ปกติ", "b": "35-45 mmHg [สไลด์]", "t": "MIS"}, {"f": "Solubility CO2/N2O/Argon-Helium", "b": "170/130/6 ml ต่อ 100 ml น้ำ [สไลด์]", "t": "MIS"}, {"f": "Support combustion / Hazardous to personnel", "b": "เฉพาะ N2O เท่านั้น (CO2, Argon/Helium ไม่ใช่) [สไลด์]", "t": "MIS"}, {"f": "Insulation failure study (Montero 2010)", "b": "ตรวจ 165 ชิ้น พบ failure 19% [สไลด์]", "t": "MIS"}, {"f": "Robotic instrument prep", "b": "cannula 8 mm, seal 5-8 mm [สไลด์]", "t": "MIS"}, {"f": "Endoscope warming liquid", "b": "ห้ามเกิน 55°C [สไลด์]", "t": "MIS"}, {"f": "daVinci Xi ประกอบด้วย", "b": "Surgeon console, Patient cart, Vision cart [สไลด์]", "t": "MIS"}, {"f": "ระบบคู่แข่ง daVinci", "b": "HUGO™ RAS System [สไลด์]", "t": "MIS"}, {"f": "Siriraj ERAS Modules", "b": "10 modules: Colorectal, Gynecology, Upper GI, Liver, Pancreas, Spine, Acute hip fracture, CVT, rAAA, Liver Transplant, Cystectomy [สไลด์]", "t": "MIS"}, {"f": "ชั้นห่อหุ้มไตจากในสู่นอก", "b": "Kidney → Fat layer → **Fibrous tissue (Gerota's fascia)** → ครอบคลุมทั้งไตและ adrenal gland [สไลด์ หน้า 7]", "t": "URO anatomy"}, {"f": "ภาพตัดขวาง (axial) แสดง fascia รอบไต", "b": "Anterior renal fascia, Posterior renal fascia, Lateral conal fascia, Transversalis fascia, Perinephric space/fat, Perinephric bridging septa, Retro-renal space, APS, PPS, Retromesenteric plane [สไลด์ หน้า 7]", "t": "URO anatomy"}, {"f": "หลอดเลือดไต", "b": "Right/Left renal a. & v., Adrenal a. & v., Superior mesenteric a., Right/Left spermatic (หรือ ovarian) a. & v. [สไลด์ หน้า 8]", "t": "URO anatomy"}, {"f": "โครงสร้างภายในไต (frontal section)", "b": "Renal cortex, Renal medulla, Renal column, Renal pyramid (ใน medulla), Renal sinus, Renal papilla, Fat in renal sinus, Renal capsule, Renal hilus → ทางเดินปัสสาวะ: **Nephron → Papillary duct → Minor calyx → Major calyx → Renal pelvis → Ureter → Bladder** [สไลด์ หน้า 9]", "t": "URO anatomy"}, {"f": "โรคที่เชื่อมกับกายวิภาค", "b": "Renal cell carcinoma (เนื้องอกที่เนื้อไต) [สไลด์ หน้า 10], Upper urinary tract cancer (UTUC) — เกิดที่ renal pelvis/ureter/bladder ได้ (papillary/epidermoid carcinoma, papilloma of ureter) [สไลด์ หน้า 11]; การผ่าตัดที่เกี่ยวข้อง: Kidney sparing surgery (flexible URS + laser) หรือ Nephroureterectomy with bladder cuff excision [สไลด์ หน้า 12]", "t": "URO anatomy"}, {"f": "Nephron ประกอบด้วย", "b": "Bowman's capsule, Glomerulus, Afferent/Efferent arteriole, Proximal convoluted tubule, Loop of Henle, Distal convoluted tubule, Collecting tubule/duct, Juxtamedullary glomerulus, Arterial/Venous vasa recta [สไลด์ หน้า 13]", "t": "URO anatomy"}, {"f": "3 ขั้นตอนสร้างปัสสาวะ", "b": "**Glomerular Filtration → Tubular Reabsorption → Tubular Secretion** ไปสู่ peritubular capillary [สไลด์ หน้า 17]", "t": "URO anatomy"}, {"f": "ความดันที่ควบคุมการกรองที่ glomerulus (net filtration)", "b": "Glomerular (blood) hydrostatic pressure **55 mmHg** − Blood colloid osmotic pressure **30 mmHg** + Capsular hydrostatic pressure **15 mmHg** → Net outward pressure **10 mmHg** [สไลด์ หน้า 16]", "t": "URO anatomy"}, {"f": "Urine production", "b": "Glomerular filtration, Tubular reabsorption, Tubular secretion, Acid-Base and Electrolyte balance", "t": "URO anatomy"}, {"f": "Hormonal function — Vasoconstrictors", "b": "Angiotensin II, Endothelin, Norepinephrine, Atrial natriuretic peptide (ANP), Vasopressin", "t": "URO anatomy"}, {"f": "Hormonal function — Vasodilators", "b": "Nitric oxide (NO), Carbon monoxide", "t": "URO anatomy"}, {"f": "Erythropoiesis", "b": "Erythropoietin", "t": "URO anatomy"}, {"f": "Bone mineral regulation", "b": "PTH, Vitamin D regulation", "t": "URO anatomy"}, {"f": "Anti-diuretic hormone", "b": "ADH regulation", "t": "URO anatomy"}, {"f": "จุดตีบตามธรรมชาติของท่อไต (normal sites of relative constriction)", "b": "**Ureteropelvic junction, Crossing iliac vessels/pelvic brim, Traversing bladder wall** [สไลด์ หน้า 20]", "t": "URO anatomy"}, {"f": "เลือดเลี้ยงท่อไตมาจากหลายแหล่งตามระดับ", "b": "ช่องท้อง — from renal artery, gonadal artery, abdominal aorta, common iliac artery; ในเชิงกราน — from internal iliac artery, superior vesical artery, uterine artery (หญิง), middle rectal artery, vaginal artery (หญิง), inferior vesical artery (ชาย) [สไลด์ หน้า 20]", "t": "URO anatomy"}, {"f": "โครงสร้างจุลกายวิภาค (microscopic)", "b": "Lumen (Transitional epithelium + Lamina propria = Mucosa) → Muscularis (Circular layer, Longitudinal layer) → Adventitia [สไลด์ หน้า 21]", "t": "URO anatomy"}, {"f": "โครงสร้าง", "b": "Ureter → Peritoneum → **Detrusor muscle** → Ureteral openings → **Trigone** → Neck of urinary bladder → **Internal urethral sphincter** → External urethral sphincter (ในผนัง urogenital diaphragm) [สไลด์ หน้า 25]", "t": "URO anatomy"}, {"f": "ผนังกระเพาะปัสสาวะ (ชั้นจากในสู่นอก)", "b": "**Transitional epithelium (Urothelium: Umbrella cells, Intermediate cells, Basal cells) + Lamina propria = Mucosa** → Submucosa → Detrusor muscle → Adventitia [สไลด์ หน้า 26]", "t": "URO anatomy"}, {"f": "ระยะของมะเร็งกระเพาะปัสสาวะ (Stages of Bladder Cancer)", "b": "**Stage 0** (precancerous lesion บนเยื่อบุ) → **Stage I** (ลุกลามเข้า connective tissue layer) → **Stage II** (ลุกลามเข้า muscular wall) → **Stage III** (ลุกลามเข้าอวัยวะข้างเคียง/ต่อมน้ำเหลืองในเชิงกราน) → **Stage IV** (แพร่ไปอวัยวะสำคัญ) [สไลด์ หน้า 27]", "t": "URO anatomy"}, {"f": "Normal lower urinary tract function มี 2 phase", "b": "**Storage (filling) phase** — low pressure reservoir, continence, no pain; **Voiding phase** — complete emptying, no obstruction, ระยะเวลาสั้น, no pain, เกิดในเวลา/สถานที่เหมาะสม [สไลด์ หน้า 32]", "t": "URO anatomy"}, {"f": "การทำงานร่วมกันต้องมี coordination ระหว่าง 4 ส่วน", "b": "Bladder, Urethra, Urethral sphincters, Pelvic floor muscle [สไลด์ หน้า 33]", "t": "URO anatomy"}, {"f": "Sympathetic", "b": "Hypogastric nerve (T11–L2) ผ่าน inferior mesenteric ganglion", "t": "URO anatomy"}, {"f": "Parasympathetic", "b": "Pelvic nerve (S2–S4) ผ่าน pelvic ganglion", "t": "URO anatomy"}, {"f": "Somatic", "b": "Pudendal nerve", "t": "URO anatomy"}, {"f": "Filling (Storage)", "b": "Relax", "t": "URO anatomy"}, {"f": "Voiding", "b": "Contract", "t": "URO anatomy"}, {"f": "Prostate anatomy by zones", "b": "**Central zone, Transition zone, Peripheral zone, Anterior fibromuscular stroma** — BPH เกิดที่ transition zone, มะเร็งต่อมลูกหมากมักเกิดที่ peripheral zone [สไลด์ หน้า 37]", "t": "URO anatomy"}, {"f": "**Colliculus seminalis** เป็น landmark สำคัญ", "b": "การตัด (resection) ต้องทำเหนือจุดนี้เพื่อไม่ให้บาดเจ็บ external urethral sphincter [สไลด์ หน้า 41]", "t": "URO anatomy"}, {"f": "Female urethra", "b": "Proximal urethra, Distal urethra; Male urethra: Prostatic urethra → Membranous urethra → Spongy (penile) urethra, ผ่าน Prostate gland [สไลด์ หน้า 39]", "t": "URO anatomy"}, {"f": "Sphincter", "b": "**Bladder neck (internal sphincter)** และ **External urethral sphincter** ที่ระดับ urogenital diaphragm — พบทั้งในหญิงและชาย โดยชายมี prostatic urethra คั่นระหว่าง bladder neck กับ external sphincter [สไลด์ หน้า 40]", "t": "URO anatomy"}, {"f": "ผนังท่อปัสสาวะหญิง (จากใน→นอก)", "b": "Urethral mucosa & submucosa → Longitudinal smooth muscle → Circular smooth muscle → Striated urogenital sphincter muscle; ในผนัง bladder neck มี Trigonal ring, Detrusor muscle, Longitudinal subepithelial venous plexus [สไลด์ หน้า 42]", "t": "URO anatomy"}, {"f": "Spermatogenesis", "b": "Primordial germ cell → (mitotic division) → Spermatogonium → Primary spermatocyte → (meiotic division I) → Secondary spermatocyte → (meiotic division II) → Spermatids → Mature sperm; เกิดใน seminiferous tubule โดยมี **Sertoli cell** และ **Leydig cell** (ใน interstitium) [สไลด์ หน้า 45]", "t": "URO anatomy"}, {"f": "มโนมนีมอนิก **\"SEVEN UP\"** ลำดับทางเดินอสุจิ", "b": "**S**eminiferous tubule, **E**pididymis, **V**as deferens, **E**jaculatory duct, **N** = (-NONE-), **U**rethra, **P**enis [สไลด์ หน้า 46]", "t": "URO anatomy"}, {"f": "Seminal vesicle", "b": "ผลิตของเหลวคิดเป็น **65–75%** ของน้ำอสุจิทั้งหมด, มี fructose (บำรุงอสุจิ), มี prostaglandins (ช่วยการปฏิสนธิ) [สไลด์ หน้า 46]", "t": "URO anatomy"}, {"f": "ความผิดปกติของอัณฑะที่สัมพันธ์กับตำแหน่งกายวิภาค", "b": "testicular torsion, epididymitis, orchitis, appendix testis torsion, testicular mass, hydrocele, spermatocele, varicocele, testicular rupture [สไลด์ หน้า 47]", "t": "URO anatomy"}, {"f": "**Male continence mechanism**", "b": "Internal sphincter อยู่ที่ **bladder neck**; External sphincter อยู่ที่ **membranous urethra** (ระหว่าง bulbous urethra กับ prostatic urethra) — **TUR-P มักทำลาย internal sphincter (bladder neck) เป็นปกติของหัตถการ** ศัลยแพทย์ต้องระวังไม่ให้บาดเจ็บ external sphincter [สไลด์ หน้า 69–70]", "t": "URO anatomy"}, {"f": "**Surgical landmark ของ TURP** ที่ต้องระบุให้ได้", "b": "**Verumontanum (distal landmark)**, **Bladder neck (proximal landmark)**, **Surgical capsule (ระดับความลึกของการตัด)** [สไลด์ หน้า 71]", "t": "URO anatomy"}, {"f": "Radical prostatectomy", "b": "ตัด entire prostate พร้อม seminal vesicle ทั้งหมด (en bloc resection) เพื่อรักษามะเร็งต่อมลูกหมาก; Partial prostatectomy (เช่น HoLEP, TURP): ตัดเฉพาะ transitional zone เพื่อรักษา BPH [สไลด์ หน้า 67–68]", "t": "URO anatomy"}, {"f": "Radical cystectomy", "b": "ตัดกระเพาะปัสสาวะพร้อม **prostate ในชาย** หรือ **anterior vagina/uterus ในหญิง** [สไลด์ หน้า 65]", "t": "URO anatomy"}, {"f": "Bowel segment ที่ใช้ทำ urinary diversion", "b": "Conduit/Neobladder ใช้ ileum หรือ colon; Continent pouch ใช้ stomach/ileum/colon; ureteral substitution ใช้ ileum [สไลด์ หน้า 77]", "t": "URO anatomy"}, {"f": "**PCN (Percutaneous nephrostomy)**", "b": "ใส่ pigtail catheter ผ่านผิวหนังเข้า renal pelvis เพื่อระบายปัสสาวะเมื่อท่อไตอุดตัน [สไลด์ หน้า 94]", "t": "URO anatomy"}, {"f": "**DJ stent (Double J stent)**", "b": "สายมีสองปลาย — ปลายบนอยู่ renal pelvis, ปลายล่างอยู่ bladder ต้องส่องกล้อง cystoscopy เพื่อใส่ [สไลด์ หน้า 97]", "t": "URO anatomy"}, {"f": "**SPC (Suprapubic cystostomy)**", "b": "ใส่ Foley catheter เข้า bladder โดยเจาะผ่านผิวหนังหน้าท้อง ต้องใช้ ultrasound guided, ขนาดที่ใช้ปกติ 16 Fr หรือ 18 Fr [สไลด์ หน้า 114–115]", "t": "URO anatomy"}, {"f": "มุมแนวไตจากแนวตั้ง (แต่ละข้าง)", "b": "30° [สไลด์ หน้า 6]", "t": "URO anatomy"}, {"f": "Glomerular (blood) hydrostatic pressure", "b": "55 mmHg [สไลด์ หน้า 16]", "t": "URO anatomy"}, {"f": "Blood colloid osmotic pressure", "b": "30 mmHg [สไลด์ หน้า 16]", "t": "URO anatomy"}, {"f": "Capsular hydrostatic pressure", "b": "15 mmHg [สไลด์ หน้า 16]", "t": "URO anatomy"}, {"f": "Net outward (filtration) pressure", "b": "10 mmHg [สไลด์ หน้า 16]", "t": "URO anatomy"}, {"f": "ปริมาตรปัสสาวะเฉลี่ยต่อวัน (ผู้ใหญ่)", "b": "1.4 ลิตร [สไลด์ หน้า 18]", "t": "URO anatomy"}, {"f": "Creatinine: ความเข้มข้นปัสสาวะ/พลาสมา", "b": "×100 [สไลด์ หน้า 18]", "t": "URO anatomy"}, {"f": "Ammonia: ความเข้มข้นปัสสาวะ/พลาสมา", "b": "×500 [สไลด์ หน้า 18]", "t": "URO anatomy"}, {"f": "Urea: ความเข้มข้นปัสสาวะ/พลาสมา", "b": "×60 [สไลด์ หน้า 18]", "t": "URO anatomy"}, {"f": "Sodium/Chloride: ความเข้มข้นปัสสาวะ/พลาสมา", "b": "×2 [สไลด์ หน้า 18]", "t": "URO anatomy"}, {"f": "Potassium: ความเข้มข้นปัสสาวะ/พลาสมา", "b": "×7 [สไลด์ หน้า 18]", "t": "URO anatomy"}, {"f": "Seminal vesicle ผลิตของเหลวคิดเป็นสัดส่วนของน้ำอสุจิ", "b": "65–75% [สไลด์ หน้า 46]", "t": "URO anatomy"}, {"f": "Sympathetic supply กระเพาะปัสสาวะ (hypogastric n.) ระดับไขสันหลัง", "b": "T11–L2 [สไลด์ หน้า 34]", "t": "URO anatomy"}, {"f": "Parasympathetic supply กระเพาะปัสสาวะ (pelvic n.) ระดับไขสันหลัง", "b": "S2–S4 [สไลด์ หน้า 34]", "t": "URO anatomy"}, {"f": "TUR syndrome — ปัจจัยเสี่ยง: น้ำหนักต่อม", "b": "> 45 g [สไลด์ หน้า 81]", "t": "URO anatomy"}, {"f": "TUR syndrome — ปัจจัยเสี่ยง: ความสูงถุงน้ำล้าง", "b": "> 60 cm จาก pubic symphysis [สไลด์ หน้า 81]", "t": "URO anatomy"}, {"f": "TUR syndrome — ปัจจัยเสี่ยง: เวลาตัด", "b": "> 90 นาที [สไลด์ หน้า 81]", "t": "URO anatomy"}, {"f": "จำนวน stage ของมะเร็งกระเพาะปัสสาวะ", "b": "0, I, II, III, IV [สไลด์ หน้า 27]", "t": "URO anatomy"}, {"f": "ขนาด SPC catheter ที่ใช้ปกติ", "b": "16 Fr หรือ 18 Fr [สไลด์ หน้า 115]", "t": "URO anatomy"}, {"f": "ไทยเข้าสู่ \"สังคมสูงวัยโดยสมบูรณ์\" แล้ว", "b": "คนไทยอายุ ≥60 ปี ≥20% [สไลด์]", "t": "Heart & Aortic"}, {"f": "โรคหัวใจไม่ได้อยู่แค่ห้องผ่าตัดหัวใจ — ตัวอย่างที่พบในหน่วยอื่น", "b": "[สไลด์]", "t": "Heart & Aortic"}, {"f": "Ortho", "b": "สะโพกหักในผู้สูงอายุที่กินยาต้านเกล็ดเลือดหลังใส่ stent", "t": "Heart & Aortic"}, {"f": "General/GI", "b": "มะเร็งลำไส้ที่ตรวจพบ AAA 5 cm โดยบังเอิญจาก CT", "t": "Heart & Aortic"}, {"f": "Eye/ENT", "b": "ผ่าตัดต้อกระจกในผู้ป่วยลิ้นหัวใจโลหะที่กิน warfarin", "t": "Heart & Aortic"}, {"f": "Uro", "b": "TURP ในผู้ป่วยกิน NOAC เพราะ AF", "t": "Heart & Aortic"}, {"f": "ทุกหน่วย", "b": "ผู้ป่วยมี pacemaker/ICD กับการใช้จี้ไฟฟ้า, เพิ่งผ่าตัดหัวใจมา 1 เดือน", "t": "Heart & Aortic"}, {"f": "หัวใจ = ปั๊ม 2 ตัว 4 ห้อง 4 ลิ้น", "b": "RA→RV→ปอด→LA→LV→aorta; ลิ้น Tricuspid·Pulmonic·Mitral·Aortic; LV ผนังหนาสุด แรงดันสูงสุด [สไลด์]", "t": "Heart & Aortic"}, {"f": "RCA", "b": "ผนังล่าง, SA/AV node", "t": "Heart & Aortic"}, {"f": "LAD", "b": "ผนังหน้าส่วนใหญ่ของ LV", "t": "Heart & Aortic"}, {"f": "LCx", "b": "ผนังด้านข้าง", "t": "Heart & Aortic"}, {"f": "ปัจจัยเสี่ยง", "b": "อายุ, เพศชาย, สูบบุหรี่, ความดันสูง, เบาหวาน-ไขมันสูง, ไตเสื่อม, ประวัติครอบครัว [สไลด์]", "t": "Heart & Aortic"}, {"f": "Stable angina", "b": "เจ็บออกแรง หายใน 5–10 นาที", "t": "Heart & Aortic"}, {"f": "ACS: NSTEMI/unstable angina", "b": "เจ็บขณะพัก >20 นาที, troponin ขึ้น", "t": "Heart & Aortic"}, {"f": "STEMI", "b": "เส้นเลือดอุดตันสมบูรณ์, ST ยก, ต้อง PCI ทันที", "t": "Heart & Aortic"}, {"f": "การรักษา 3 ทาง", "b": "ยา (aspirin, statin, beta-blocker — ทุกคนต้องได้), PCI+stent (ต้องกิน DAPT 6–12 เดือน), CABG (เหมาะกับ 3 เส้น/left main/เบาหวาน/บีบตัวไม่ดี) [สไลด์]", "t": "Heart & Aortic"}, {"f": "CABG ใช้เส้นเลือดผู้ป่วยเอง", "b": "LIMA (หลังกระดูกอก), saphenous vein (ขา), radial artery (แขน); แผลกระดูกอกติดใน 6–8 สัปดาห์; หลีกเลี่ยงวัดความดัน/เจาะเลือดแขนที่เอา radial artery ไปใช้ [สไลด์]", "t": "Heart & Aortic"}, {"f": "สาเหตุ", "b": "Rheumatic (คนไทยอายุน้อย-กลางคน, มักมี AF), Degenerative (ผู้สูงอายุ, ลิ้นเอออร์ติกหินปูนตีบ), Infective endocarditis [สไลด์]", "t": "Heart & Aortic"}, {"f": "**Aortic stenosis** — Ross & Braunwald", "b": "การรอดชีวิตหลังเริ่มมีอาการ (ถ้าไม่รักษา) [สไลด์]", "t": "Heart & Aortic"}, {"f": "เจ็บหน้าอก (angina)", "b": "5 ปี", "t": "Heart & Aortic"}, {"f": "เป็นลม (syncope)", "b": "3 ปี", "t": "Heart & Aortic"}, {"f": "หัวใจล้มเหลว (HF)", "b": "2 ปี", "t": "Heart & Aortic"}, {"f": "Mitral", "b": "MS ส่วนใหญ่จากรูมาติก, MR ซ่อมลิ้นดีกว่าเปลี่ยน, AF พบบ่อย→ warfarin/NOAC [สไลด์]", "t": "Heart & Aortic"}, {"f": "Mechanical (โลหะ)", "b": "warfarin ตลอดชีวิต, ห้ามใช้ NOAC", "t": "Heart & Aortic"}, {"f": "Bioprosthetic (เนื้อเยื่อ)", "b": "ไม่ต้อง warfarin ระยะยาว", "t": "Heart & Aortic"}, {"f": "ต้องถามทุกครั้ง", "b": "ลิ้นหัวใจเทียมแบบโลหะหรือเนื้อเยื่อ? — เปลี่ยนแผนหยุดยาทั้งหมด [สไลด์]", "t": "Heart & Aortic"}, {"f": "เทรนด์", "b": "TAVI (ผ่านขาหนีบ) และ minimally invasive surgery — สปสช. เริ่มให้สิทธิ์ TAVI แล้ว [สไลด์]", "t": "Heart & Aortic"}, {"f": "แบ่งตาม EF", "b": "HFrEF ≤40%, HFmrEF 41–49%, HFpEF ≥50% (พบมากในผู้สูงอายุ) [สไลด์]", "t": "Heart & Aortic"}, {"f": "NYHA", "b": "I ไม่มีอาการ, II เหนื่อยกิจกรรมปกติ, III เหนื่อยกิจกรรมเล็กน้อย, IV เหนื่อยขณะพัก [สไลด์]", "t": "Heart & Aortic"}, {"f": "บันไดการรักษา", "b": "ยา (ARNI/ACEi, beta-blocker, MRA, SGLT2 inhibitor) → อุปกรณ์ (CRT, ICD) → Temporary MCS (IABP, Impella, ECMO) → LVAD → Heart transplant [สไลด์]", "t": "Heart & Aortic"}, {"f": "3 แบบหลัก", "b": "โป่ง (aneurysm) — ไม่มีอาการส่วนใหญ่, ปริ/ฉีกเซาะ (dissection) — เจ็บทันทีรุนแรง, แตก (rupture/trauma) — เสียชีวิตเร็ว [สไลด์]", "t": "Heart & Aortic"}, {"f": "Aneurysm เสี่ยง", "b": "ชายอายุ >65 ปี, สูบบุหรี่, ความดันสูง, ประวัติครอบครัว, Marfan/connective tissue disease [สไลด์]", "t": "Heart & Aortic"}, {"f": "ขนาดผ่าตัดทั่วไป (ascending/descending, AAA ชาย)", "b": "5.5 cm", "t": "Heart & Aortic"}, {"f": "เกณฑ์เล็กลง (AAA หญิง, Marfan)", "b": "5.0 cm", "t": "Heart & Aortic"}, {"f": "โตเร็ว", "b": "≥0.5 cm/ปี", "t": "Heart & Aortic"}, {"f": "มีอาการ", "b": "ผ่าตัดทุกขนาด", "t": "Heart & Aortic"}, {"f": "เป้าหมายก่อนผ่าตัด type B", "b": "ชีพจร <60, SBP 100–120 mmHg (beta-blocker ก่อนยาขยายหลอดเลือด) [สไลด์]", "t": "Heart & Aortic"}, {"f": "เทรนด์การรักษา", "b": "Ascending/root → ผ่าตัดเปิด+เครื่องหัวใจ-ปอดเทียม; Aortic arch → ผ่าตัดเปิด±frozen elephant trunk; Descending → TEVAR (ทางเลือกแรก); Thoracoabdominal → ผ่าตัดเปิดหรือ F/BEVAR [สไลด์]", "t": "Heart & Aortic"}, {"f": "หลัง TEVAR/EVAR", "b": "ตรวจแผลขาหนีบ/ชีพจรขา/กำลังขาทุกชั่วโมงช่วงแรก — ขาอ่อนแรง = spinal cord ischemia [สไลด์]", "t": "Heart & Aortic"}, {"f": "(เนื้อหาเสริมในสไลด์ นอกหัวข้อหลักที่ระบุ) Transplant/ECMO/ECPR — หัวใจปลูกถ่ายทนขาดเลือดได้ ~4 ชั่วโมง, denervated heart ใช้ atropine ไม่ได้ผลต้องใช้ epinephrine/isoproterenol; VA-ECMO=หัวใจ+ปอด, VV-ECMO=ปอดอย่างเดียว; ECPR timeline", "b": "0=CPR ทันที, 10–15 นาที=เรียกทีม ECPR, ≤60 นาที=ECMO flow เริ่ม [สไลด์]", "t": "Heart & Aortic"}, {"f": "Low", "b": "<1%", "t": "Heart & Aortic"}, {"f": "Intermediate", "b": "1–5%", "t": "Heart & Aortic"}, {"f": "High", "b": ">5%", "t": "Heart & Aortic"}, {"f": "Aspirin", "b": "ส่วนใหญ่ไม่หยุด (หยุด 7 วันเฉพาะผ่าตัดสมอง/ไขสันหลัง/ช่องหลังตา)", "t": "Heart & Aortic"}, {"f": "Clopidogrel", "b": "5 วัน", "t": "Heart & Aortic"}, {"f": "Ticagrelor", "b": "3–5 วัน", "t": "Heart & Aortic"}, {"f": "Prasugrel", "b": "7 วัน", "t": "Heart & Aortic"}, {"f": "≤30 วัน", "b": "ห้ามผ่าตัด elective (stent อุดตัน)", "t": "Heart & Aortic"}, {"f": "3 เดือน", "b": "Time-sensitive เช่นมะเร็ง พิจารณาได้", "t": "Heart & Aortic"}, {"f": "6 เดือน", "b": "Stent จากโรคเรื้อรัง (CCD) → elective ได้", "t": "Heart & Aortic"}, {"f": "12 เดือน", "b": "Stent จาก ACS/MI → elective ได้", "t": "Heart & Aortic"}, {"f": "Balloon angioplasty อย่างเดียว", "b": "รอ ≥14 วัน", "t": "Heart & Aortic"}, {"f": "Apixaban/Rivaroxaban/Edoxaban", "b": "1 วัน", "t": "Heart & Aortic"}, {"f": "Dabigatran (CrCl ≥50)", "b": "1 วัน", "t": "Heart & Aortic"}, {"f": "Dabigatran (CrCl <50)", "b": "2 วัน", "t": "Heart & Aortic"}, {"f": "เริ่มยาใหม่หลังผ่าตัด", "b": "24 ชม. (เลือดออกน้อย-ปานกลาง) / 48–72 ชม. (เลือดออกสูง) [สไลด์]", "t": "Heart & Aortic"}, {"f": "ห้ามใช้ NOAC กับลิ้นหัวใจโลหะ; ยาแก้ฤทธิ์ฉุกเฉิน", "b": "idarucizumab (dabigatran), PCC (anti-Xa) [สไลด์]", "t": "Heart & Aortic"}, {"f": "ชาย 70 ปี stent (DES) จาก MI มา 2 เดือน, นัดผ่าตัดเข่า (elective)", "b": "เลื่อนผ่าตัด — stent จาก MI ควรรอ 12 เดือน, ห้ามหยุด ticagrelor เอง", "t": "Heart & Aortic"}, {"f": "หญิง 75 ปี AF กิน apixaban, Cr ปกติ, นัดผ่าตัดไส้เลื่อน (เลือดออกน้อย-ปานกลาง)", "b": "งด 1 วันก่อนผ่าตัด ไม่ต้อง bridging (ถ้า spinal block งด 3 วัน)", "t": "Heart & Aortic"}, {"f": "ชาย 68 ปี มะเร็งลำไส้ + CT พบ AAA 6.0 cm ไม่มีอาการ", "b": "ทีม aortic + ศัลยแพทย์ตัดสินใจร่วม มักทำ EVAR ก่อนแล้วผ่าตัดลำไส้ตามมา", "t": "Heart & Aortic"}];
let CARDS=[{"f": "ที่มา", "b": "แนวคิดเกิดขึ้นช่วงปี 1970 โดย **David McClelland** (20 พ.ค. 1917 – 27 มี.ค. 1998) นักจิตวิทยาชาวอเมริกัน ศึกษาว่าทำไมคนตำแหน่งเดียวกันมีผลงานต่างกัน [สไลด์]", "t": "Competency in OR"}, {"f": "นิยาม McClelland", "b": "บุคลิกลักษณะที่ซ่อนอยู่ภายในแต่ละบุคคลซึ่งผลักดันให้สร้างผลการปฏิบัติงานที่ดีหรือตามเกณฑ์ที่กำหนด [สไลด์]", "t": "Competency in OR"}, {"f": "นิยามเพิ่ม", "b": "คุณลักษณะของบุคคลที่แสดงพฤติกรรมและความคิดอย่างต่อเนื่อง...เชื่อมโยงกับผลการปฏิบัติงานที่ดีเยี่ยม; \"คุณลักษณะที่มีผลต่อพฤติกรรมและผลการปฏิบัติงาน ประกอบด้วยทักษะ ความรู้ ความสามารถ ทัศนคติ บุคลิกภาพ ค่านิยม\" [สไลด์]", "t": "Competency in OR"}, {"f": "นิยาม สนง. ก.พ. (2553)", "b": "กลุ่มของความรู้ ความสามารถ ทักษะ ทัศนคติที่จำเป็นในการทำงานได้อย่างมีประสิทธิภาพและประสิทธิผล [สไลด์]", "t": "Competency in OR"}, {"f": "**Iceberg Model** (อ้างอิง David C. McClelland - Lyle M. Spencer, Jr.)", "b": "ส่วนบนน้ำ (มองเห็นง่าย) = ความรู้ (Knowledge) + ทักษะ (Skill); ส่วนใต้น้ำ (มองเห็นยาก) = Social Role, Self-Image, Trait, Motives [สไลด์]", "t": "Competency in OR"}, {"f": "แหล่ง", "b": "หนังสือ \"สมรรถนะพยาบาลห้องผ่าตัด (Perioperative Nurse Competencies)\" สมาคมพยาบาลห้องผ่าตัดแห่งประเทศไทย พ.ศ. 2554 (ISBN 978-974-350-657-4) [สไลด์]", "t": "Competency in OR"}, {"f": "นิยาม Competency ในหนังสือนี้อ้างอิงหลายแหล่ง", "b": "Cambridge International Dictionary (1995), JCAHO (1993 อ้างใน Gruendemann and Fernsebnee, 1995), AORN (1999) [สไลด์]", "t": "Competency in OR"}, {"f": "ประเภทสมรรถนะตามจิรประภา อัครบวร (2549)", "b": "Core competency / Functional competency (2 ประเภท — คนละกรอบกับ Core/Technical/Non-Technical ของสไลด์นี้เอง) [สไลด์]", "t": "Competency in OR"}, {"f": "ด้าน 1 (ความปลอดภัย)", "b": "ป้องกันบาดเจ็บเนื้อเยื่อจาก สารเคมี / เครื่องจี้ไฟฟ้า / รังสี / การเคลื่อนย้าย / การจัดท่า", "t": "Competency in OR"}, {"f": "ด้าน 2 (ร่างกาย)", "b": "ป้องกันติดเชื้อ, การกำซาบเนื้อเยื่อ, อุณหภูมิกาย, สมดุลสารน้ำ/อิเลคโทรไลท์/กรดด่าง, ระบบหัวใจ-หลอดเลือด, จัดการความปวด", "t": "Competency in OR"}, {"f": "ด้าน 3 (ตอบสนองพฤติกรรม)", "b": "ให้ความรู้ผู้ป่วย/ญาติ, จริยธรรมและพิทักษ์สิทธิผู้ป่วย", "t": "Competency in OR"}, {"f": "ด้าน 4 (ระบบสุขภาพ)", "b": "ความเป็นวิชาชีพ, ปฏิบัติตามนโยบาย/มาตรฐานหน่วยงาน, สนับสนุนเป้าหมายองค์กร", "t": "Competency in OR"}, {"f": "หมายเหตุแยกกรอบ", "b": "สนง.ก.พ. มี **สมรรถนะหลักภาครัฐ 5 ด้าน** ต่างหาก (ดูตาราง 3) — คนละกรอบกับ Core/Technical/Non-Technical ของหน่วยงาน ห้ามปนกัน [สไลด์]", "t": "Competency in OR"}, {"f": "โครงสร้าง 3 กลุ่มงาน Technical Competency การพยาบาลผ่าตัด", "b": "**กลุ่ม 1** หน่วยผ่าตัด (Circulating nurse / Scrub nurse / บริหารจัดการเครื่องมือผ่าตัด), **กลุ่ม 2** หน่วยพักฟื้นก่อน-หลังผ่าตัด (PACU), **กลุ่ม 3** หน่วยตรวจด้วยเครื่องมือพิเศษ [สไลด์]", "t": "Competency in OR"}, {"f": "PL1", "b": "ปฏิบัติตาม WI ถูกต้อง (นับผ้าซับโลหิต/ของมีคม, ล้างมือ, เปิดห่อปลอดเชื้อ, Aseptic/Sterile technique)", "t": "Competency in OR"}, {"f": "PL2", "b": "รู้โรค/แนวทางรักษาในขอบเขตหน่วยงาน (พยาธิสรีรภาพ, จัด Position, ยา/สารน้ำ, ป้องกันแทรกซ้อนเช่นสูญเสียความร้อน, จัดเตรียมเครื่องมือพื้นฐาน)", "t": "Competency in OR"}, {"f": "PL3", "b": "ประเมินปัญหา ตัดสินใจจัดการสถานการณ์ด้วยตนเอง (Circulating/Scrub nurse ภายใต้พี่เลี้ยง)", "t": "Competency in OR"}, {"f": "PL4", "b": "วางแผน/ให้การพยาบาลองค์รวมเหมาะสมรายบุคคล, จัดลำดับความสำคัญ (Early detection เช่น ป้องกัน hypothermia, preoperative visit)", "t": "Competency in OR"}, {"f": "PL5", "b": "คาดการณ์/ตัดสินใจแก้ปัญหาสอดคล้องผู้ป่วยแต่ละราย, บูรณาการความรู้ใหม่ (Case management, CQI, Best practice, Innovation, Research)", "t": "Competency in OR"}, {"f": "นิยาม", "b": "ทักษะรอบด้าน (กระบวนการคิด สื่อสาร ทักษะสังคม) ร่วมกับ technical skill เพื่อลดผิดพลาด เพิ่มความปลอดภัย; **เรียนรู้/ฝึกได้หลังมีประสบการณ์ทำงานในห้องผ่าตัดแล้วเท่านั้น** ไม่ใช่ก่อนเข้าปฏิบัติงานจริง [สไลด์]", "t": "Competency in OR"}, {"f": "ANTS", "b": "วิสัญญีแพทย์", "t": "Competency in OR"}, {"f": "NOTSS", "b": "ศัลยแพทย์", "t": "Competency in OR"}, {"f": "SPINTS", "b": "พยาบาลส่งเครื่องมือ", "t": "Competency in OR"}, {"f": "SPINTS หมวดย่อย", "b": "Situation awareness (Gathering info / Recognizing&understanding / Anticipating), Communication&teamwork (Acting assertively / Exchanging info / Coordinating), Task management (Planning&preparing / Providing&maintaining standards / Coping with pressure) [สไลด์]", "t": "Competency in OR"}, {"f": "งานวิจัยอ้างอิง", "b": "การสังเกตพฤติกรรม Non-technical skill ของพยาบาลส่งเครื่องมือผ่าตัด; Redaelli I. \"Nontechnical skills of the operating theatre circulating nurse: An ethnographic study\" (J Adv Nurs, 2018); Kalantari R. et al. \"Development and psychometric evaluation of a behavioral marker system for circulating nurse's non-technical skills\" (Perioperative Care and Operating Room Management, 2021) [สไลด์]", "t": "Competency in OR"}, {"f": "นิยาม", "b": "การเทียบเคียงความสามารถของผู้ถูกประเมินตามตำแหน่ง บทบาทหน้าที่ ความรับผิดชอบ และความก้าวหน้าในอาชีพ [สไลด์]", "t": "Competency in OR"}, {"f": "วิธีประเมิน", "b": "**Audit, Certification/Training, CQI/PI, Interview, Observation, Testing** [สไลด์]", "t": "Competency in OR"}, {"f": "เครื่องมือ", "b": "แบบวัดความรู้ (ข้อสอบ), แบบวัดทัศนคติ, แบบวัดการปฏิบัติ [สไลด์]", "t": "Competency in OR"}, {"f": "ความถี่", "b": "**ปีละ 1 ครั้ง** เพื่อพัฒนาสมรรถนะให้มีประสิทธิภาพสูงอยู่เสมอ [สไลด์]", "t": "Competency in OR"}, {"f": "แผนพัฒนา", "b": "(1) ผู้รับการประเมินกำหนดเอง (2) ผู้บังคับบัญชากำหนดตามความจำเป็น/ความเร่งด่วน/Schedule อบรม [สไลด์]", "t": "Competency in OR"}, {"f": "JD พยาบาลผ่าตัดแบ่ง 3 ช่วง", "b": "**ก่อนผ่าตัด / ระหว่างผ่าตัด / หลังผ่าตัด** [สไลด์]", "t": "Competency in OR"}, {"f": "โครงการพัฒนาบุคลากร", "b": "โครงการเตรียมความพร้อมก่อนปฏิบัติงาน, โครงการพัฒนาศักยภาพพยาบาลห้องผ่าตัด, โครงการอบรมเฉพาะทางสาขาต่างๆ, Residency Training Program [สไลด์]", "t": "Competency in OR"}, {"f": "David McClelland", "b": "20 พ.ค. 1917 – 27 มี.ค. 1998, นักจิตวิทยาอเมริกัน, เริ่มแนวคิด Competency ปี 1970 [สไลด์]", "t": "Competency in OR"}, {"f": "สมรรถนะพยาบาลห้องผ่าตัด 4 ด้าน", "b": "ความปลอดภัยผู้ป่วย / ร่างกาย / ตอบสนองพฤติกรรม / ระบบสุขภาพ [สไลด์]", "t": "Competency in OR"}, {"f": "แหล่งกำหนด 4 ด้าน", "b": "สมาคมพยาบาลห้องผ่าตัดแห่งประเทศไทย พ.ศ. 2554 (ISBN 978-974-350-657-4) [สไลด์]", "t": "Competency in OR"}, {"f": "ประเภท Competency (สไลด์นี้)", "b": "Core / Technical / Non-Technical (3 ประเภท) [สไลด์]", "t": "Competency in OR"}, {"f": "Technical Competency ย่อย", "b": "Basic / Specific / Advance [สไลด์]", "t": "Competency in OR"}, {"f": "ประเภทสมรรถนะ (จิรประภา อัครบวร, 2549)", "b": "Core competency / Functional competency (2 ประเภท) [สไลด์]", "t": "Competency in OR"}, {"f": "Benner (1984)", "b": "Novice 0-1y / Advance beginner 1-2y / Competent 2-3y / Proficient 3-5y / Expert 5y+ [สไลด์]", "t": "Competency in OR"}, {"f": "Proficiency Level", "b": "PL1-PL5 (WI ถูกต้อง → บูรณาการ/วิจัย) [สไลด์]", "t": "Competency in OR"}, {"f": "ANTS หมวด", "b": "Task Mgmt / Team Working / Situation Awareness / Decision Making (4 หมวด, วิสัญญีแพทย์) [สไลด์]", "t": "Competency in OR"}, {"f": "NOTSS หมวด", "b": "Situation Awareness / Decision Making / Communication&Teamwork / Leadership (4 หมวด, ศัลยแพทย์) [สไลด์]", "t": "Competency in OR"}, {"f": "SPINTS หมวด (ดั้งเดิม)", "b": "Situation Awareness / Communication&Teamwork / Task Management (3 หมวด, พยาบาลส่งเครื่องมือ) [สไลด์]", "t": "Competency in OR"}, {"f": "Non-technical skills in Perioperative Nurses", "b": "4 หมวดเต็ม (เพิ่ม Decision making and leadership) [สไลด์]", "t": "Competency in OR"}, {"f": "Scrub/Circulating Nurse Competency", "b": "Level 1-5 [สไลด์]", "t": "Competency in OR"}, {"f": "วิธีประเมิน Competency", "b": "Audit / Certification-Training / CQI-PI / Interview / Observation / Testing (6 วิธี) [สไลด์]", "t": "Competency in OR"}, {"f": "เครื่องมือประเมิน", "b": "แบบวัดความรู้(ข้อสอบ) / แบบวัดทัศนคติ / แบบวัดการปฏิบัติ (3 แบบ) [สไลด์]", "t": "Competency in OR"}, {"f": "ความถี่ประเมิน", "b": "ปีละ 1 ครั้ง [สไลด์]", "t": "Competency in OR"}, {"f": "สมรรถนะหลักภาครัฐ (ก.พ., 2553)", "b": "5 ด้าน: มุ่งผลสัมฤทธิ์ / บริการที่ดี / สั่งสมความเชี่ยวชาญในงานอาชีพ / ยึดมั่นความถูกต้องชอบธรรมและจริยธรรม / ทำงานเป็นทีม [สไลด์]", "t": "Competency in OR"}, {"f": "สภาการพยาบาล ประกาศสมรรถนะหลัก", "b": "ประกาศ ณ 23 ก.พ. 2561 อาศัยมาตรา 22(1),23(1)(ก) พรบ.วิชาชีพการพยาบาลฯ 2528 (แก้ไขฉบับที่2 พ.ศ.2540) [สไลด์]", "t": "Competency in OR"}, {"f": "Job Description พยาบาลผ่าตัด", "b": "ก่อนผ่าตัด / ระหว่างผ่าตัด / หลังผ่าตัด [สไลด์]", "t": "Competency in OR"}, {"f": "อ้างอิง", "b": "Kroh M. Innovations and New Technologies in Gastrointestinal Surgery. Med UNAB, 2022;25(3):461-469", "t": "MIS"}, {"f": "Benefits of **ICG & Fluorescence Imaging** ใน Lap Hepatectomy", "b": "(1) Improved tumor identification (2) Accurate segmental resection (3) Enhances safety (เห็น critical vascular structures real-time)", "t": "MIS"}, {"f": "Robotic Instruments Preparation", "b": "cannula 8 mm, 5-8 mm cannula seal, gage pin test", "t": "MIS"}, {"f": "Robotic Endoscope Preparation", "b": "8 mm endoscopes, ใช้ Antifog, **ห้ามใช้ warming liquid เกิน 55°C**", "t": "MIS"}, {"f": "Inventory Management", "b": "single-use devices, ตรวจสอบผ่าน touchscreen ใต้ setting tab, ต้องมี tracking system (barcode/RFID/ระบบดิจิทัล) และ preventive maintenance", "t": "MIS"}, {"f": "Standardize Instrument Tray", "b": "Spatula, L-hook, Endoclinch, Marryland, Bowel clamp, Grasper, Scissors", "t": "MIS"}, {"f": "Reprocessing", "b": "Cleaning/Pre-cleaning ทันทีหลังใช้ด้วย enzymatic detergent+น้ำกลั่น (ห้ามใช้แปรงแข็ง/น้ำร้อนจัด); Disinfection & Sterilization: Low-temperature sterilization (Hydrogen peroxide plasma, E.O.) หรือ Steam sterilization (เฉพาะเครื่องมือทนความร้อน)", "t": "MIS"}, {"f": "Extreme positioning", "b": "gravitational effect ทำให้อวัยวะเคลื่อนออกจาก surgical field; risk factors: old age, coexisting cardiac/pulmonary disease", "t": "MIS"}, {"f": "ผลต่อร่างกาย", "b": "เพิ่ม risk of CO2 retention, intracranial pressure, intraocular pressure, mean arterial pressure", "t": "MIS"}, {"f": "Super obesity patient", "b": "โต๊ะผ่าตัดใหญ่ขึ้น, foot board (reverse Trendelenburg 12-15°), safety strap พิเศษ (extra wide & long), laparoscopic instruments ยาวขึ้น (43-44 cm), เจ้าหน้าที่เพียงพอสำหรับ \"**2P safety**\" (การเคลื่อนย้ายผู้ป่วย) [สไลด์]", "t": "MIS"}, {"f": "Supine-Arm Wrapping", "b": "ต้อง tuck แขนให้ถูกตำแหน่ง (ไม่ยื่นเกิน OR Bed Platform) — อ้างอิง AORN 2023 \"Best Practices for Safe Perioperative Patient Positioning\" [สไลด์]", "t": "MIS"}, {"f": "อุปกรณ์ป้องกัน Pressure injury", "b": "Prophylactic Foam Dressing (multi-layer), Gel, Bean bag, OR Table pads, Pressure Reduction System (PRS); Normothermia: Warming mattress, Force air warmer, Warm irrigation, Warm CO2 Gas, Room Temp 20-22°C", "t": "MIS"}, {"f": "MEWS PI", "b": "ใช้ KPI การประเมิน pressure injury; Bundle ป้องกันมี 4 องค์ประกอบ: Maintenance of normothermia, Special padding, Positioning devices, Polyurethane foam dressing [สไลด์]", "t": "MIS"}, {"f": "Risk assessment (AORN, 2017)", "b": "Laparoscopic surgery + Lithotomy position + **Operative time > 3 ชั่วโมง** + risk factor (old age, obesity)", "t": "MIS"}, {"f": "อาการ DVT", "b": "บวมขา, ปวด/กดเจ็บ, ผิวหนังอุ่น, ผิวแดง/เปลี่ยนสี", "t": "MIS"}, {"f": "อาการ Pulmonary Embolism", "b": "หายใจสั้น, เจ็บหน้าอกเฉียบพลัน, วิงเวียน, หัวใจเต้นผิดจังหวะ, ไอเป็นเลือด", "t": "MIS"}, {"f": "Intervention", "b": "sequential pneumatic compression device", "t": "MIS"}, {"f": "Contraindication ของ mechanical VTE prophylaxis (NCCN, 2015)", "b": "platelet < 20,000 (severe thrombocytopenia), แผลเปิด/dermatitis/vein ligation/gangrene/recent skin graft ที่ขา, severe arteriosclerosis หรือ ischemic vascular disease, massive edema ขาหรือ pulmonary edema จาก CHF, extreme leg deformity/varicose vein, มี DVT/PE/thrombophlebitis มาก่อนใน 6 เดือน [สไลด์]", "t": "MIS"}, {"f": "ผลกระทบ", "b": "Shivering, เพิ่ม oxygen consumption, เพิ่ม workload ของ myocardium", "t": "MIS"}, {"f": "ปัจจัย", "b": "Insufflated CO2 temp 15-22°C (ขึ้นกับเวลา/flow rate), Irrigation fluid temperature", "t": "MIS"}, {"f": "**งานวิจัยหลัก** (Wongyingsinn M, et al. BMC Anesthesiology 2023;23:137)", "b": "n=742 ราย, postoperative hypothermia **11.9%**; กลุ่ม monitor intraoperative core temp (n=117) พบ intraoperative hypothermia **73.5%**; ปัจจัยสัมพันธ์กับ postoperative hypothermia: ASA physical status III-IV (**OR=1.78**), preoperative hypothermia (**OR=17.99**) [สไลด์]", "t": "MIS"}, {"f": "วิธีป้องกัน", "b": "warming/humidification ของ anesthetic gases, warming IV/irrigation fluids, warming mattress; **forced-air warming blankets/devices \"ไม่แนะนำ\"** เพราะมีหลักฐานเพิ่มความเสี่ยงติดเชื้อ (Koc BB, et al. Orthop Nurs 2017;33(1):356-60) [สไลด์]", "t": "MIS"}, {"f": "Siriraj audit ผล keep core temp > 36°C", "b": "ปี 2567 = **69.84%**; เม.ย.-มิ.ย. 2568 = **82.61% (38/46 ราย)**; core temp < 36°C พบ **5 ราย (21.05%)** [สไลด์]", "t": "MIS"}, {"f": "ข้อควรระวัง", "b": "Insufflator ต้องอยู่สูงกว่า surgical cavity (ป้องกัน cross contamination); insufflation tubing ต้อง flush ด้วยแก๊สก่อนต่อ cannula (ลด air embolism); ใช้ single-use hydrophobic filter", "t": "MIS"}, {"f": "CO2 pneumoperitoneum ความเสี่ยง", "b": "Hypercarbia, CO2 retention, Subcutaneous emphysema, Hypothermia, Shoulder pain, CO2 embolism", "t": "MIS"}, {"f": "Monitoring", "b": "**ETCO2 ค่าปกติ 35-45 mmHg**", "t": "MIS"}, {"f": "อาการ CO2 embolism", "b": "ความดันเลือดลดฮวบ, ETCO2 ลดฮวบ, O2 saturation ลดเร็ว", "t": "MIS"}, {"f": "Intervention CO2 embolism", "b": "หยุด CO2 insufflation, จัด Trendelenburg position, NSS irrigation, ใส่ central line", "t": "MIS"}, {"f": "การศึกษา (Montero et al, 2010)", "b": "ตรวจสอบ laparoscopic instruments แบบใช้ซ้ำ **165 ชิ้น** พบ insulation failure **19%** → แนะนำตรวจสอบเป็นประจำด้วย Insulation failure tester [สไลด์]", "t": "MIS"}, {"f": "Goals of SiERAS", "b": "ลด stress response หลังผ่าตัด, เร่ง recovery, กลับสู่ function ก่อนรับการรักษาหรือดีกว่า, ผู้ป่วยพึงพอใจเมื่อจำหน่าย", "t": "MIS"}, {"f": "ERAS Standardize protocols", "b": "ERAS HPB intra-operative phase — บทบาท OR nurse; มีการเก็บข้อมูลต่อเนื่อง audit ปรับปรุง protocol", "t": "MIS"}, {"f": "Patient safety concern 5 ข้อ", "b": "positioning / pressure injury / DVT / pneumoperitoneum / hypothermia [สไลด์]", "t": "MIS"}, {"f": "Lithotomy elevation effect", "b": "ทุก 1 ฟุตเหนือ aorta → ankle pressure ลด ~20 mmHg [สไลด์]", "t": "MIS"}, {"f": "Super obese: reverse Trendelenburg", "b": "12-15° [สไลด์]", "t": "MIS"}, {"f": "Super obese: instrument length", "b": "43-44 cm [สไลด์]", "t": "MIS"}, {"f": "OR bed mattress pad", "b": "8 cm และ 4.5 cm [สไลด์]", "t": "MIS"}, {"f": "Room temp แนะนำ", "b": "20-22°C [สไลด์]", "t": "MIS"}, {"f": "Insufflated CO2 temp", "b": "15-22°C [สไลด์]", "t": "MIS"}, {"f": "DVT risk (AORN 2017)", "b": "Lap surgery + Lithotomy + operative time > 3 ชม. + old age/obesity [สไลด์]", "t": "MIS"}, {"f": "VTE prophylaxis contraindication (NCCN 2015)", "b": "platelet < 20,000 และอื่นๆ (ดูรายละเอียด 2.7) [สไลด์]", "t": "MIS"}, {"f": "Hypothermia study (Wongyingsinn 2023)", "b": "n=742, postop incidence 11.9%; n=117 intraop 73.5%; OR ASA III-IV=1.78; OR preop hypothermia=17.99 [สไลด์]", "t": "MIS"}, {"f": "Warmed/humidified CO2 → core temp", "b": "เพิ่มเฉลี่ย 0.3°C (Dean M, 2017) [สไลด์]", "t": "MIS"}, {"f": "Forced-air warming ไม่แนะนำ (เพิ่ม infection risk)", "b": "Koc BB, Orthop Nurs 2017;33(1):356-60 [สไลด์]", "t": "MIS"}, {"f": "Siriraj keep core temp >36°C", "b": "ปี 2567=69.84%; เม.ย.-มิ.ย.68=82.61%(38/46); <36°C=5ราย(21.05%) [สไลด์]", "t": "MIS"}, {"f": "ETCO2 ปกติ", "b": "35-45 mmHg [สไลด์]", "t": "MIS"}, {"f": "Solubility CO2/N2O/Argon-Helium", "b": "170/130/6 ml ต่อ 100 ml น้ำ [สไลด์]", "t": "MIS"}, {"f": "Support combustion / Hazardous to personnel", "b": "เฉพาะ N2O เท่านั้น (CO2, Argon/Helium ไม่ใช่) [สไลด์]", "t": "MIS"}, {"f": "Insulation failure study (Montero 2010)", "b": "ตรวจ 165 ชิ้น พบ failure 19% [สไลด์]", "t": "MIS"}, {"f": "Robotic instrument prep", "b": "cannula 8 mm, seal 5-8 mm [สไลด์]", "t": "MIS"}, {"f": "Endoscope warming liquid", "b": "ห้ามเกิน 55°C [สไลด์]", "t": "MIS"}, {"f": "daVinci Xi ประกอบด้วย", "b": "Surgeon console, Patient cart, Vision cart [สไลด์]", "t": "MIS"}, {"f": "ระบบคู่แข่ง daVinci", "b": "HUGO™ RAS System [สไลด์]", "t": "MIS"}, {"f": "Siriraj ERAS Modules", "b": "10 modules: Colorectal, Gynecology, Upper GI, Liver, Pancreas, Spine, Acute hip fracture, CVT, rAAA, Liver Transplant, Cystectomy [สไลด์]", "t": "MIS"}, {"f": "ชั้นห่อหุ้มไตจากในสู่นอก", "b": "Kidney → Fat layer → **Fibrous tissue (Gerota's fascia)** → ครอบคลุมทั้งไตและ adrenal gland [สไลด์ หน้า 7]", "t": "URO anatomy"}, {"f": "ภาพตัดขวาง (axial) แสดง fascia รอบไต", "b": "Anterior renal fascia, Posterior renal fascia, Lateral conal fascia, Transversalis fascia, Perinephric space/fat, Perinephric bridging septa, Retro-renal space, APS, PPS, Retromesenteric plane [สไลด์ หน้า 7]", "t": "URO anatomy"}, {"f": "หลอดเลือดไต", "b": "Right/Left renal a. & v., Adrenal a. & v., Superior mesenteric a., Right/Left spermatic (หรือ ovarian) a. & v. [สไลด์ หน้า 8]", "t": "URO anatomy"}, {"f": "โครงสร้างภายในไต (frontal section)", "b": "Renal cortex, Renal medulla, Renal column, Renal pyramid (ใน medulla), Renal sinus, Renal papilla, Fat in renal sinus, Renal capsule, Renal hilus → ทางเดินปัสสาวะ: **Nephron → Papillary duct → Minor calyx → Major calyx → Renal pelvis → Ureter → Bladder** [สไลด์ หน้า 9]", "t": "URO anatomy"}, {"f": "โรคที่เชื่อมกับกายวิภาค", "b": "Renal cell carcinoma (เนื้องอกที่เนื้อไต) [สไลด์ หน้า 10], Upper urinary tract cancer (UTUC) — เกิดที่ renal pelvis/ureter/bladder ได้ (papillary/epidermoid carcinoma, papilloma of ureter) [สไลด์ หน้า 11]; การผ่าตัดที่เกี่ยวข้อง: Kidney sparing surgery (flexible URS + laser) หรือ Nephroureterectomy with bladder cuff excision [สไลด์ หน้า 12]", "t": "URO anatomy"}, {"f": "Nephron ประกอบด้วย", "b": "Bowman's capsule, Glomerulus, Afferent/Efferent arteriole, Proximal convoluted tubule, Loop of Henle, Distal convoluted tubule, Collecting tubule/duct, Juxtamedullary glomerulus, Arterial/Venous vasa recta [สไลด์ หน้า 13]", "t": "URO anatomy"}, {"f": "3 ขั้นตอนสร้างปัสสาวะ", "b": "**Glomerular Filtration → Tubular Reabsorption → Tubular Secretion** ไปสู่ peritubular capillary [สไลด์ หน้า 17]", "t": "URO anatomy"}, {"f": "ความดันที่ควบคุมการกรองที่ glomerulus (net filtration)", "b": "Glomerular (blood) hydrostatic pressure **55 mmHg** − Blood colloid osmotic pressure **30 mmHg** + Capsular hydrostatic pressure **15 mmHg** → Net outward pressure **10 mmHg** [สไลด์ หน้า 16]", "t": "URO anatomy"}, {"f": "Urine production", "b": "Glomerular filtration, Tubular reabsorption, Tubular secretion, Acid-Base and Electrolyte balance", "t": "URO anatomy"}, {"f": "Hormonal function — Vasoconstrictors", "b": "Angiotensin II, Endothelin, Norepinephrine, Atrial natriuretic peptide (ANP), Vasopressin", "t": "URO anatomy"}, {"f": "Hormonal function — Vasodilators", "b": "Nitric oxide (NO), Carbon monoxide", "t": "URO anatomy"}, {"f": "Erythropoiesis", "b": "Erythropoietin", "t": "URO anatomy"}, {"f": "Bone mineral regulation", "b": "PTH, Vitamin D regulation", "t": "URO anatomy"}, {"f": "Anti-diuretic hormone", "b": "ADH regulation", "t": "URO anatomy"}, {"f": "จุดตีบตามธรรมชาติของท่อไต (normal sites of relative constriction)", "b": "**Ureteropelvic junction, Crossing iliac vessels/pelvic brim, Traversing bladder wall** [สไลด์ หน้า 20]", "t": "URO anatomy"}, {"f": "เลือดเลี้ยงท่อไตมาจากหลายแหล่งตามระดับ", "b": "ช่องท้อง — from renal artery, gonadal artery, abdominal aorta, common iliac artery; ในเชิงกราน — from internal iliac artery, superior vesical artery, uterine artery (หญิง), middle rectal artery, vaginal artery (หญิง), inferior vesical artery (ชาย) [สไลด์ หน้า 20]", "t": "URO anatomy"}, {"f": "โครงสร้างจุลกายวิภาค (microscopic)", "b": "Lumen (Transitional epithelium + Lamina propria = Mucosa) → Muscularis (Circular layer, Longitudinal layer) → Adventitia [สไลด์ หน้า 21]", "t": "URO anatomy"}, {"f": "โครงสร้าง", "b": "Ureter → Peritoneum → **Detrusor muscle** → Ureteral openings → **Trigone** → Neck of urinary bladder → **Internal urethral sphincter** → External urethral sphincter (ในผนัง urogenital diaphragm) [สไลด์ หน้า 25]", "t": "URO anatomy"}, {"f": "ผนังกระเพาะปัสสาวะ (ชั้นจากในสู่นอก)", "b": "**Transitional epithelium (Urothelium: Umbrella cells, Intermediate cells, Basal cells) + Lamina propria = Mucosa** → Submucosa → Detrusor muscle → Adventitia [สไลด์ หน้า 26]", "t": "URO anatomy"}, {"f": "ระยะของมะเร็งกระเพาะปัสสาวะ (Stages of Bladder Cancer)", "b": "**Stage 0** (precancerous lesion บนเยื่อบุ) → **Stage I** (ลุกลามเข้า connective tissue layer) → **Stage II** (ลุกลามเข้า muscular wall) → **Stage III** (ลุกลามเข้าอวัยวะข้างเคียง/ต่อมน้ำเหลืองในเชิงกราน) → **Stage IV** (แพร่ไปอวัยวะสำคัญ) [สไลด์ หน้า 27]", "t": "URO anatomy"}, {"f": "Normal lower urinary tract function มี 2 phase", "b": "**Storage (filling) phase** — low pressure reservoir, continence, no pain; **Voiding phase** — complete emptying, no obstruction, ระยะเวลาสั้น, no pain, เกิดในเวลา/สถานที่เหมาะสม [สไลด์ หน้า 32]", "t": "URO anatomy"}, {"f": "การทำงานร่วมกันต้องมี coordination ระหว่าง 4 ส่วน", "b": "Bladder, Urethra, Urethral sphincters, Pelvic floor muscle [สไลด์ หน้า 33]", "t": "URO anatomy"}, {"f": "Sympathetic", "b": "Hypogastric nerve (T11–L2) ผ่าน inferior mesenteric ganglion", "t": "URO anatomy"}, {"f": "Parasympathetic", "b": "Pelvic nerve (S2–S4) ผ่าน pelvic ganglion", "t": "URO anatomy"}, {"f": "Somatic", "b": "Pudendal nerve", "t": "URO anatomy"}, {"f": "Filling (Storage)", "b": "Relax", "t": "URO anatomy"}, {"f": "Voiding", "b": "Contract", "t": "URO anatomy"}, {"f": "Prostate anatomy by zones", "b": "**Central zone, Transition zone, Peripheral zone, Anterior fibromuscular stroma** — BPH เกิดที่ transition zone, มะเร็งต่อมลูกหมากมักเกิดที่ peripheral zone [สไลด์ หน้า 37]", "t": "URO anatomy"}, {"f": "**Colliculus seminalis** เป็น landmark สำคัญ", "b": "การตัด (resection) ต้องทำเหนือจุดนี้เพื่อไม่ให้บาดเจ็บ external urethral sphincter [สไลด์ หน้า 41]", "t": "URO anatomy"}, {"f": "Female urethra", "b": "Proximal urethra, Distal urethra; Male urethra: Prostatic urethra → Membranous urethra → Spongy (penile) urethra, ผ่าน Prostate gland [สไลด์ หน้า 39]", "t": "URO anatomy"}, {"f": "Sphincter", "b": "**Bladder neck (internal sphincter)** และ **External urethral sphincter** ที่ระดับ urogenital diaphragm — พบทั้งในหญิงและชาย โดยชายมี prostatic urethra คั่นระหว่าง bladder neck กับ external sphincter [สไลด์ หน้า 40]", "t": "URO anatomy"}, {"f": "ผนังท่อปัสสาวะหญิง (จากใน→นอก)", "b": "Urethral mucosa & submucosa → Longitudinal smooth muscle → Circular smooth muscle → Striated urogenital sphincter muscle; ในผนัง bladder neck มี Trigonal ring, Detrusor muscle, Longitudinal subepithelial venous plexus [สไลด์ หน้า 42]", "t": "URO anatomy"}, {"f": "Spermatogenesis", "b": "Primordial germ cell → (mitotic division) → Spermatogonium → Primary spermatocyte → (meiotic division I) → Secondary spermatocyte → (meiotic division II) → Spermatids → Mature sperm; เกิดใน seminiferous tubule โดยมี **Sertoli cell** และ **Leydig cell** (ใน interstitium) [สไลด์ หน้า 45]", "t": "URO anatomy"}, {"f": "มโนมนีมอนิก **\"SEVEN UP\"** ลำดับทางเดินอสุจิ", "b": "**S**eminiferous tubule, **E**pididymis, **V**as deferens, **E**jaculatory duct, **N** = (-NONE-), **U**rethra, **P**enis [สไลด์ หน้า 46]", "t": "URO anatomy"}, {"f": "Seminal vesicle", "b": "ผลิตของเหลวคิดเป็น **65–75%** ของน้ำอสุจิทั้งหมด, มี fructose (บำรุงอสุจิ), มี prostaglandins (ช่วยการปฏิสนธิ) [สไลด์ หน้า 46]", "t": "URO anatomy"}, {"f": "ความผิดปกติของอัณฑะที่สัมพันธ์กับตำแหน่งกายวิภาค", "b": "testicular torsion, epididymitis, orchitis, appendix testis torsion, testicular mass, hydrocele, spermatocele, varicocele, testicular rupture [สไลด์ หน้า 47]", "t": "URO anatomy"}, {"f": "**Male continence mechanism**", "b": "Internal sphincter อยู่ที่ **bladder neck**; External sphincter อยู่ที่ **membranous urethra** (ระหว่าง bulbous urethra กับ prostatic urethra) — **TUR-P มักทำลาย internal sphincter (bladder neck) เป็นปกติของหัตถการ** ศัลยแพทย์ต้องระวังไม่ให้บาดเจ็บ external sphincter [สไลด์ หน้า 69–70]", "t": "URO anatomy"}, {"f": "**Surgical landmark ของ TURP** ที่ต้องระบุให้ได้", "b": "**Verumontanum (distal landmark)**, **Bladder neck (proximal landmark)**, **Surgical capsule (ระดับความลึกของการตัด)** [สไลด์ หน้า 71]", "t": "URO anatomy"}, {"f": "Radical prostatectomy", "b": "ตัด entire prostate พร้อม seminal vesicle ทั้งหมด (en bloc resection) เพื่อรักษามะเร็งต่อมลูกหมาก; Partial prostatectomy (เช่น HoLEP, TURP): ตัดเฉพาะ transitional zone เพื่อรักษา BPH [สไลด์ หน้า 67–68]", "t": "URO anatomy"}, {"f": "Radical cystectomy", "b": "ตัดกระเพาะปัสสาวะพร้อม **prostate ในชาย** หรือ **anterior vagina/uterus ในหญิง** [สไลด์ หน้า 65]", "t": "URO anatomy"}, {"f": "Bowel segment ที่ใช้ทำ urinary diversion", "b": "Conduit/Neobladder ใช้ ileum หรือ colon; Continent pouch ใช้ stomach/ileum/colon; ureteral substitution ใช้ ileum [สไลด์ หน้า 77]", "t": "URO anatomy"}, {"f": "**PCN (Percutaneous nephrostomy)**", "b": "ใส่ pigtail catheter ผ่านผิวหนังเข้า renal pelvis เพื่อระบายปัสสาวะเมื่อท่อไตอุดตัน [สไลด์ หน้า 94]", "t": "URO anatomy"}, {"f": "**DJ stent (Double J stent)**", "b": "สายมีสองปลาย — ปลายบนอยู่ renal pelvis, ปลายล่างอยู่ bladder ต้องส่องกล้อง cystoscopy เพื่อใส่ [สไลด์ หน้า 97]", "t": "URO anatomy"}, {"f": "**SPC (Suprapubic cystostomy)**", "b": "ใส่ Foley catheter เข้า bladder โดยเจาะผ่านผิวหนังหน้าท้อง ต้องใช้ ultrasound guided, ขนาดที่ใช้ปกติ 16 Fr หรือ 18 Fr [สไลด์ หน้า 114–115]", "t": "URO anatomy"}, {"f": "มุมแนวไตจากแนวตั้ง (แต่ละข้าง)", "b": "30° [สไลด์ หน้า 6]", "t": "URO anatomy"}, {"f": "Glomerular (blood) hydrostatic pressure", "b": "55 mmHg [สไลด์ หน้า 16]", "t": "URO anatomy"}, {"f": "Blood colloid osmotic pressure", "b": "30 mmHg [สไลด์ หน้า 16]", "t": "URO anatomy"}, {"f": "Capsular hydrostatic pressure", "b": "15 mmHg [สไลด์ หน้า 16]", "t": "URO anatomy"}, {"f": "Net outward (filtration) pressure", "b": "10 mmHg [สไลด์ หน้า 16]", "t": "URO anatomy"}, {"f": "ปริมาตรปัสสาวะเฉลี่ยต่อวัน (ผู้ใหญ่)", "b": "1.4 ลิตร [สไลด์ หน้า 18]", "t": "URO anatomy"}, {"f": "Creatinine: ความเข้มข้นปัสสาวะ/พลาสมา", "b": "×100 [สไลด์ หน้า 18]", "t": "URO anatomy"}, {"f": "Ammonia: ความเข้มข้นปัสสาวะ/พลาสมา", "b": "×500 [สไลด์ หน้า 18]", "t": "URO anatomy"}, {"f": "Urea: ความเข้มข้นปัสสาวะ/พลาสมา", "b": "×60 [สไลด์ หน้า 18]", "t": "URO anatomy"}, {"f": "Sodium/Chloride: ความเข้มข้นปัสสาวะ/พลาสมา", "b": "×2 [สไลด์ หน้า 18]", "t": "URO anatomy"}, {"f": "Potassium: ความเข้มข้นปัสสาวะ/พลาสมา", "b": "×7 [สไลด์ หน้า 18]", "t": "URO anatomy"}, {"f": "Seminal vesicle ผลิตของเหลวคิดเป็นสัดส่วนของน้ำอสุจิ", "b": "65–75% [สไลด์ หน้า 46]", "t": "URO anatomy"}, {"f": "Sympathetic supply กระเพาะปัสสาวะ (hypogastric n.) ระดับไขสันหลัง", "b": "T11–L2 [สไลด์ หน้า 34]", "t": "URO anatomy"}, {"f": "Parasympathetic supply กระเพาะปัสสาวะ (pelvic n.) ระดับไขสันหลัง", "b": "S2–S4 [สไลด์ หน้า 34]", "t": "URO anatomy"}, {"f": "TUR syndrome — ปัจจัยเสี่ยง: น้ำหนักต่อม", "b": "> 45 g [สไลด์ หน้า 81]", "t": "URO anatomy"}, {"f": "TUR syndrome — ปัจจัยเสี่ยง: ความสูงถุงน้ำล้าง", "b": "> 60 cm จาก pubic symphysis [สไลด์ หน้า 81]", "t": "URO anatomy"}, {"f": "TUR syndrome — ปัจจัยเสี่ยง: เวลาตัด", "b": "> 90 นาที [สไลด์ หน้า 81]", "t": "URO anatomy"}, {"f": "จำนวน stage ของมะเร็งกระเพาะปัสสาวะ", "b": "0, I, II, III, IV [สไลด์ หน้า 27]", "t": "URO anatomy"}, {"f": "ขนาด SPC catheter ที่ใช้ปกติ", "b": "16 Fr หรือ 18 Fr [สไลด์ หน้า 115]", "t": "URO anatomy"}, {"f": "ไทยเข้าสู่ \"สังคมสูงวัยโดยสมบูรณ์\" แล้ว", "b": "คนไทยอายุ ≥60 ปี ≥20% [สไลด์]", "t": "Heart & Aortic"}, {"f": "โรคหัวใจไม่ได้อยู่แค่ห้องผ่าตัดหัวใจ — ตัวอย่างที่พบในหน่วยอื่น", "b": "[สไลด์]", "t": "Heart & Aortic"}, {"f": "Ortho", "b": "สะโพกหักในผู้สูงอายุที่กินยาต้านเกล็ดเลือดหลังใส่ stent", "t": "Heart & Aortic"}, {"f": "General/GI", "b": "มะเร็งลำไส้ที่ตรวจพบ AAA 5 cm โดยบังเอิญจาก CT", "t": "Heart & Aortic"}, {"f": "Eye/ENT", "b": "ผ่าตัดต้อกระจกในผู้ป่วยลิ้นหัวใจโลหะที่กิน warfarin", "t": "Heart & Aortic"}, {"f": "Uro", "b": "TURP ในผู้ป่วยกิน NOAC เพราะ AF", "t": "Heart & Aortic"}, {"f": "ทุกหน่วย", "b": "ผู้ป่วยมี pacemaker/ICD กับการใช้จี้ไฟฟ้า, เพิ่งผ่าตัดหัวใจมา 1 เดือน", "t": "Heart & Aortic"}, {"f": "หัวใจ = ปั๊ม 2 ตัว 4 ห้อง 4 ลิ้น", "b": "RA→RV→ปอด→LA→LV→aorta; ลิ้น Tricuspid·Pulmonic·Mitral·Aortic; LV ผนังหนาสุด แรงดันสูงสุด [สไลด์]", "t": "Heart & Aortic"}, {"f": "RCA", "b": "ผนังล่าง, SA/AV node", "t": "Heart & Aortic"}, {"f": "LAD", "b": "ผนังหน้าส่วนใหญ่ของ LV", "t": "Heart & Aortic"}, {"f": "LCx", "b": "ผนังด้านข้าง", "t": "Heart & Aortic"}, {"f": "ปัจจัยเสี่ยง", "b": "อายุ, เพศชาย, สูบบุหรี่, ความดันสูง, เบาหวาน-ไขมันสูง, ไตเสื่อม, ประวัติครอบครัว [สไลด์]", "t": "Heart & Aortic"}, {"f": "Stable angina", "b": "เจ็บออกแรง หายใน 5–10 นาที", "t": "Heart & Aortic"}, {"f": "ACS: NSTEMI/unstable angina", "b": "เจ็บขณะพัก >20 นาที, troponin ขึ้น", "t": "Heart & Aortic"}, {"f": "STEMI", "b": "เส้นเลือดอุดตันสมบูรณ์, ST ยก, ต้อง PCI ทันที", "t": "Heart & Aortic"}, {"f": "การรักษา 3 ทาง", "b": "ยา (aspirin, statin, beta-blocker — ทุกคนต้องได้), PCI+stent (ต้องกิน DAPT 6–12 เดือน), CABG (เหมาะกับ 3 เส้น/left main/เบาหวาน/บีบตัวไม่ดี) [สไลด์]", "t": "Heart & Aortic"}, {"f": "CABG ใช้เส้นเลือดผู้ป่วยเอง", "b": "LIMA (หลังกระดูกอก), saphenous vein (ขา), radial artery (แขน); แผลกระดูกอกติดใน 6–8 สัปดาห์; หลีกเลี่ยงวัดความดัน/เจาะเลือดแขนที่เอา radial artery ไปใช้ [สไลด์]", "t": "Heart & Aortic"}, {"f": "สาเหตุ", "b": "Rheumatic (คนไทยอายุน้อย-กลางคน, มักมี AF), Degenerative (ผู้สูงอายุ, ลิ้นเอออร์ติกหินปูนตีบ), Infective endocarditis [สไลด์]", "t": "Heart & Aortic"}, {"f": "**Aortic stenosis** — Ross & Braunwald", "b": "การรอดชีวิตหลังเริ่มมีอาการ (ถ้าไม่รักษา) [สไลด์]", "t": "Heart & Aortic"}, {"f": "เจ็บหน้าอก (angina)", "b": "5 ปี", "t": "Heart & Aortic"}, {"f": "เป็นลม (syncope)", "b": "3 ปี", "t": "Heart & Aortic"}, {"f": "หัวใจล้มเหลว (HF)", "b": "2 ปี", "t": "Heart & Aortic"}, {"f": "Mitral", "b": "MS ส่วนใหญ่จากรูมาติก, MR ซ่อมลิ้นดีกว่าเปลี่ยน, AF พบบ่อย→ warfarin/NOAC [สไลด์]", "t": "Heart & Aortic"}, {"f": "Mechanical (โลหะ)", "b": "warfarin ตลอดชีวิต, ห้ามใช้ NOAC", "t": "Heart & Aortic"}, {"f": "Bioprosthetic (เนื้อเยื่อ)", "b": "ไม่ต้อง warfarin ระยะยาว", "t": "Heart & Aortic"}, {"f": "ต้องถามทุกครั้ง", "b": "ลิ้นหัวใจเทียมแบบโลหะหรือเนื้อเยื่อ? — เปลี่ยนแผนหยุดยาทั้งหมด [สไลด์]", "t": "Heart & Aortic"}, {"f": "เทรนด์", "b": "TAVI (ผ่านขาหนีบ) และ minimally invasive surgery — สปสช. เริ่มให้สิทธิ์ TAVI แล้ว [สไลด์]", "t": "Heart & Aortic"}, {"f": "แบ่งตาม EF", "b": "HFrEF ≤40%, HFmrEF 41–49%, HFpEF ≥50% (พบมากในผู้สูงอายุ) [สไลด์]", "t": "Heart & Aortic"}, {"f": "NYHA", "b": "I ไม่มีอาการ, II เหนื่อยกิจกรรมปกติ, III เหนื่อยกิจกรรมเล็กน้อย, IV เหนื่อยขณะพัก [สไลด์]", "t": "Heart & Aortic"}, {"f": "บันไดการรักษา", "b": "ยา (ARNI/ACEi, beta-blocker, MRA, SGLT2 inhibitor) → อุปกรณ์ (CRT, ICD) → Temporary MCS (IABP, Impella, ECMO) → LVAD → Heart transplant [สไลด์]", "t": "Heart & Aortic"}, {"f": "3 แบบหลัก", "b": "โป่ง (aneurysm) — ไม่มีอาการส่วนใหญ่, ปริ/ฉีกเซาะ (dissection) — เจ็บทันทีรุนแรง, แตก (rupture/trauma) — เสียชีวิตเร็ว [สไลด์]", "t": "Heart & Aortic"}, {"f": "Aneurysm เสี่ยง", "b": "ชายอายุ >65 ปี, สูบบุหรี่, ความดันสูง, ประวัติครอบครัว, Marfan/connective tissue disease [สไลด์]", "t": "Heart & Aortic"}, {"f": "ขนาดผ่าตัดทั่วไป (ascending/descending, AAA ชาย)", "b": "5.5 cm", "t": "Heart & Aortic"}, {"f": "เกณฑ์เล็กลง (AAA หญิง, Marfan)", "b": "5.0 cm", "t": "Heart & Aortic"}, {"f": "โตเร็ว", "b": "≥0.5 cm/ปี", "t": "Heart & Aortic"}, {"f": "มีอาการ", "b": "ผ่าตัดทุกขนาด", "t": "Heart & Aortic"}, {"f": "เป้าหมายก่อนผ่าตัด type B", "b": "ชีพจร <60, SBP 100–120 mmHg (beta-blocker ก่อนยาขยายหลอดเลือด) [สไลด์]", "t": "Heart & Aortic"}, {"f": "เทรนด์การรักษา", "b": "Ascending/root → ผ่าตัดเปิด+เครื่องหัวใจ-ปอดเทียม; Aortic arch → ผ่าตัดเปิด±frozen elephant trunk; Descending → TEVAR (ทางเลือกแรก); Thoracoabdominal → ผ่าตัดเปิดหรือ F/BEVAR [สไลด์]", "t": "Heart & Aortic"}, {"f": "หลัง TEVAR/EVAR , {"f": "หญิง 75 ปี AF กิน apixaban, Cr ปกติ, นัดผ่าตัดไส้เลื่อน (เลือดออกน้อย-ปานกลาง)", "b": "งด 1 วันก่อนผ่าตัด ไม่ต้อง bridging (ถ้า spinal block งด 3 วัน)", "t": "Heart & Aortic"}, {"f": "ชาย 68 ปี มะเร็งลำไส้ + CT พบ AAA 6.0 cm ไม่มีอาการ", "b": "ทีม aortic + ศัลยแพทย์ตัดสินใจร่วม มักทำ EVAR ก่อนแล้วผ่าตัดลำไส้ตามมา", "t": "Heart & Aortic"}];
let META={"Competency in OR": 51, "MIS": 53, "URO anatomy": 63, "Heart & Aortic": 60};
let deck=CARDS, seq=[], pos=0;
const byTag=key=>document.getElementById(key);
function select(f){
  deck = (f==='all') ? CARDS.slice() : CARDS.filter(c=>c.t===f);
  seq = [...Array(deck.length).keys()];
  pos = 0;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('sel'));
  const b=[...document.querySelectorAll('.fbtn')].find(x=>x.dataset.v===f);
  if(b)b.classList.add('sel');
  render();
}
function render(){
  if(!deck.length)return;
  const c = deck[seq[pos]];
  byTag('front').innerHTML = md(c.f);
  byTag('back').innerHTML = md(c.b);
  byTag('cradtag').textContent = c.t;
  byTag('cside').textContent = 'หน้า';
  byTag('back').style.display='none';
  byTag('front').style.display='';
  byTag('hint').style.display='';
  byTag('prog').textContent = 'การ์ด '+(pos+1)+'/'+deck.length+' · '+c.t;
}
function md(t){return t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');}
function flip(){const fr=byTag('front'),bo=byTag('back');
  if(bo.style.display==='none'){fr.style.display='none';bo.style.display='';byTag('cside').textContent='หลัง';byTag('hint').style.display='none';}
  else{bo.style.display='none';fr.style.display='';byTag('cside').textContent='หน้า';byTag('hint').style.display='';}
}
const fb=byTag('filters');
[['ทั้งหมด','all'],...Object.keys(META).map(t=>[t,t])].forEach(([label,val])=>{const b=document.createElement('button');b.className='fbtn';b.dataset.v=val;b.textContent=label;b.onclick=()=>select(val);fb.appendChild(b);});
byTag('card').onclick=flip;
byTag('next').onclick=()=>{if(!deck.length)return;pos=(pos+1)%deck.length;render();};
byTag('prev').onclick=()=>{if(!deck.length)return;pos=(pos-1+deck.length)%deck.length;render();};
byTag('shuf').onclick=()=>{for(let i=seq.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[seq[i],seq[j]]=[seq[j],seq[i]];}pos=0;render();};
byTag('rord').onclick=()=>{seq.sort((a,b)=>a-b);pos=0;render();};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown')byTag('next').click();
 else if(e.key==='ArrowLeft'||e.key==='ArrowUp')byTag('prev').click();
 else if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();}});
select('all');
</script></body></html>
